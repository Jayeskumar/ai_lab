    agent: Mathematical Skeptic
    kind: rejection
    text: "H-C14-3 refuted by the symmetric difference: K2 xor K2 xor K2 = K2 xor K_{1,3} (connected, order 8), and in all graphs C4 = K2 xor K2 = K2 xor 2K1. Cause: K2 absorbs Seidel switching, and C4 ~ K_{1,3}."
    refs: [EXP-C14-04, CLM-C14-08, CLM-C14-07]
  - key: C14-07
    agent: Mathematical Explorer
    kind: pattern
    text: "Complete bipartite graphs under xor behave like split-complex numbers: K_{a,b} xor K_{c,d} = K_{ac+bd, ad+bc}, i.e. order and imbalance multiply - the order-15 collision 3K1 xor K_{2,3} = K_{1,2} xor K_{1,4} is (3,3)(5,1) = (3,1)(5,3)."
    refs: [CLM-C14-07, EXP-C14-04]
  - key: C14-08
    agent: Mathematical Explorer
    kind: surprise
    text: "On the level the product actually sees - two-graphs - every factorisation up to order 16 is unique, and on co-connected graphs (product 141 on connected graphs) none collide up to order 15. H-C14-4 survives as a conjecture."
    refs: [EXP-C14-05, CLM-C14-12, CLM-C14-13]
  - key: C14-09
