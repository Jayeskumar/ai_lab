    text: "The connected Cartesian prime counts are OEIS A129582 (Ji Li 2007) for every n <= 15, which also validates the census pipeline; the strong product gives identical counts because both monoids are polynomial semirings in their connected primes. No source found for the Seidel-Kronecker identity of the symmetric difference beyond the edgeless-factor special case."
    refs: [CLM-C14-09, CLM-C14-06]
  - key: C14-10
