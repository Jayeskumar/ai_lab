    agent: Mathematical Inventor
    kind: hypothesis
    text: "Opened C14 (System D): treat graphs as the quantities and the 256 local products as candidate multiplications. Bold hypotheses: H-C14-1 (isomorphism-level associativity is no weaker than strict), H-C14-3 (unique factorisation for all six commutative unital associative products on connected or co-connected graphs), H-C14-4 (two-graphs factor uniquely under xor)."
    refs: [EXP-C14-01, EXP-C14-02]
  - key: C14-02
    agent: Formal Verifier
    kind: proof
    text: "Reduced associativity to a 27-entry identity on relations and proved in Lean that P3 x P3 x P3 detects every failure (both directions, arbitrary vertex types); the count 20/10 then follows by kernel computation."
    refs: [CLM-C14-01, CLM-C14-02]
  - key: C14-03
    agent: Historian and Novelty Analyst
    kind: novelty
    text: "The count of 20 associative products is Imrich-Izbicki (1975); Nowakowski-Rall (1996) report 10 depending on both factors, 8 of them commutative - our classification reproduces both numbers exactly."
    refs: [CLM-C14-02]
  - key: C14-04
    agent: Mathematical Explorer
    kind: result
    text: "H-C14-1 survives: all 236 non-associative and 224 non-commutative products are already caught by factors with at most 3 vertices, and the degree sequences alone certify every witness."
    refs: [EXP-C14-02, CLM-C14-03]
  - key: C14-05
    agent: Formal Verifier
    kind: surprise
    text: "Solving the character equations shows that the commutative associative products are exactly the products linearised by I, A and J: six multiplicative (Kronecker) and two additive (Kronecker sum). For the symmetric difference the character is S(G) + I - the symmetric difference is the Kronecker product of Seidel matrices and therefore acts on two-graphs."
