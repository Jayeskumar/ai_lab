experiments:
  - id: EXP-C01-01
    analysis: Exact partitions of 25 slices coincide with symbol-count partitions; completion of the swap relations is the finite system {yx -> xy | x < y} whose normal forms are sorted words.
    verification: PROVEN
    novelty: REDISCOVERY
    related: [CLM-C01-01]
  - id: EXP-C01-02
    analysis: All 6159 relation sets agree with index = min m_i and period = gcd(n_i - m_i) under two independent methods.
    verification: PROVEN
    novelty: REDISCOVERY
    related: [CLM-C01-02, CLM-C01-03]
  - id: EXP-C01-03
    analysis: Substitutions on one symbol form (N, +, x); on two symbols modulo commutation composition is non-commutative (154/200 random pairs).
    related: [CLM-C01-04]
  - id: EXP-C01-04
    analysis: Every one of the 33 rearranging relations of length 3-4 has words whose class is strictly smaller than their counting class; H-C01-4 refuted. Unexpected regularity in the class counts (Fibonacci and tribonacci partial sums) triggered H-C01-5.
    counterexamples: ["aab <-> aba: class of baa is {baa}, counting class {aab, aba, baa}"]
    verification: REFUTED
    related: [CLM-C01-05, CLM-C01-06]
  - id: EXP-C01-05
    analysis: H-C01-5 holds for all 756 relations with an unbordered side; 81 of the 281 relations with both sides bordered deviate from the generic count, all sharing a common border.
    related: [CLM-C01-06, CLM-C01-08]
  - id: EXP-C01-06
    analysis: The common-border formula (H-C01-7) holds for all 2159 relations tested, including 1326 hard relations not covered by Theorem 5.
    related: [CLM-C01-08]
  - id: EXP-C01-07
    analysis: 1632 relations proved for all n by independently re-verified finite completions; 527 hard relations have infinite completions within the search bounds.
    related: [CLM-C01-07, CLM-C01-08]
    future: [Parametric (regular) completions for the 527 open relations]
  - id: EXP-C01-08
    analysis: In-lab replication of the novelty audit - confluence iff border containment (0 mismatches in 28,850 pairs); all 527 open relations have no common border; exactly 12 hard relations have a (single) common border; the formula holds for three k = 8 relations with two common borders (n <= 13).
    related: [CLM-C01-08, CLM-C01-09, CLM-C01-10, CLM-C01-11]

claims:
  - id: CLM-C01-01
    type: theorem
    system: SYS-A
    title: Symbol counts are the complete invariant of the commutation congruence
    statement: |
      Two words over a finite alphabet are congruent modulo the swap relations xy = yx iff every symbol occurs
      equally often in both; the projection of a word onto a symbol s is the unary word s...s of that length.
    verification: PROVEN
    proof_check: Lean 4 + Mathlib (commEq_iff_count, projection_is_unary); standard axioms only
    proof: proofs/paper/C01.md#theorem-1-clm-c01-01--counting-is-the-complete-invariant-of-commutation
    lean: [proofs/lean/Infinity/C01_Quantity.lean]
    evidence: [EXP-C01-01]
    novelty: REDISCOVERY
    novelty_basis: Free commutative monoid on Sigma is N^Sigma (Parikh vectors, Parikh 1966); special case of Mazurkiewicz trace monoids (Cartier-Foata 1969).
    applications: Linear-time decision of equality modulo commutation; justifies introducing N in System C.
  - id: CLM-C01-02
    type: theorem
    system: SYS-A
    title: One symbol, one relation a^m = a^(m+p) gives exactly m+p classes (index m, period p)
    statement: |
      On one-symbol words, a^x ~ a^y modulo a^m = a^(m+p) (p >= 1) iff nf(x) = nf(y) with nf(x) = x for x < m and
      m + ((x - m) mod p) otherwise; there are exactly m + p classes.
    verification: PROVEN
    proof_check: Lean 4 + Mathlib (gen_iff, exactly_m_add_p_classes); standard axioms only
    proof: proofs/paper/C01.md#theorem-2-clm-c01-02--one-symbol-one-relation-index-and-period
    lean: [proofs/lean/Infinity/C01_Quantity.lean]
    evidence: [EXP-C01-02]
    novelty: REDISCOVERY
    novelty_basis: Index and period of monogenic semigroups (e.g. Howie 1995, Fundamentals of Semigroup Theory).
  - id: CLM-C01-03
    type: theorem
    system: SYS-A
    title: Several one-symbol relations have index min m_i and period gcd(n_i - m_i)
    statement: |
      The congruence on {a}* generated by a^(m_i) = a^(n_i) (m_i < n_i, i = 1..r) identifies a^x and a^y iff
      x = y or (x, y >= M and P | x - y), where M = min m_i and P = gcd(n_i - m_i); it has M + P classes.
    verification: PROVEN
    proof_check: written proof (proofs/paper/C01.md, Theorem 3); computationally corroborated on 6159 relation sets; awaiting independent skeptic review
    proof: proofs/paper/C01.md#theorem-3-clm-c01-03--one-symbol-several-relations
    evidence: [EXP-C01-02]
    novelty: REDISCOVERY
    novelty_basis: Standard description of finitely generated congruences on (N,+) / cyclic semigroups.
  - id: CLM-C01-04
    type: theorem
    system: SYS-A
    title: Multiplication emerges as composition of substitutions; with two symbols it is non-commutative
    statement: |
      (End({a}*), pointwise juxtaposition, composition) is a commutative semiring isomorphic to (N, +, x) via
      phi -> |phi(a)|. For two symbols modulo commutation, composition of endomorphisms is not commutative.
    verification: PROVEN
    proof_check: written proof (proofs/paper/C01.md, Theorem 4) with exhaustive check of all laws on a^0..a^12 (EXP-C01-03); awaiting independent skeptic review
    proof: proofs/paper/C01.md#theorem-4-clm-c01-04--multiplication-as-composition-of-transformations
    evidence: [EXP-C01-03]
    novelty: REDISCOVERY
    novelty_basis: Endomorphism semiring of (N,+) is (N,+,x); endomorphisms of N^2 are 2x2 matrices over N.
  - id: CLM-C01-05
    type: hypothesis
    system: SYS-A
    title: "H-C01-4: a single rearranging relation generates counting equivalence on long words (refuted)"
    statement: |
      For every relation u <-> v over {a,b} with u != v and equal symbol counts, the generated congruence
      coincides with counting (Parikh) equivalence on all words of length >= |u|.
    verification: REFUTED
    counterexample: "u = aab, v = aba: the word baa is fixed by every rewrite, so its class {baa} is smaller than its counting class {aab, aba, baa}. All 33 relations of length 3-4 fail (EXP-C01-04)."
    evidence: [EXP-C01-04]
    novelty: REDISCOVERY
    novelty_basis: The negative answer is implied by the Golod-Shafarevich/Anick lower bound H >= 1/(1 - qx + x^k) for one-relator algebras (Anick 1982; Piontkovski 1999) - a single relation cannot make the classes as coarse as counting classes. Historian audit, reviews/historian_C01_C02.md.
    change_reason: Historian novelty audit 2026-10-18 (reviews/historian_C01_C02.md)
  - id: CLM-C01-06
    type: theorem
    system: SYS-A
    title: Border-containment theorem for one length-preserving relation
    statement: |
      Let u != v be words of length k over a q-letter alphabet with Borders(u) contained in Borders(v). Then
      {u -> v} is convergent, the classes of length-n words modulo u = v correspond to the length-n words
      avoiding u, and the class-count generating function is c_u(x) / (x^k + (1 - q x) c_u(x)), c_u the
      autocorrelation polynomial of u. For unbordered u this is 1/(1 - q x + x^k); for q = 2 the counts are
      partial sums of (k-1)-bonacci numbers (k = 3: F(n+3) - 1).
    verification: PROVEN
    proof_check: written proof (proofs/paper/C01.md, Theorem 5); its overlap lemma is Lean-verified (common_border_joinable); corroborated by 756 + 1632 relations; awaiting independent skeptic review
    proof: proofs/paper/C01.md#theorem-5-clm-c01-06--the-border-containment-theorem
    lean: [proofs/lean/Infinity/C01_Quantity.lean]
    evidence: [EXP-C01-04, EXP-C01-05, EXP-C01-07]
    novelty: REDISCOVERY
    novelty_basis: "Length-preserving special case of the one-rule confluence criterion of W. Kurth, Some combinatorial properties of complete semi-Thue systems, Sem. Lothar. Combin. B18m (1987) https://www.mat.univie.ac.at/~slc/opapers/s18kurth.html (generalising Book 1983 and F. Otto, C. Wrathall, Math. Systems Theory 18 (1985) 135-143, https://doi.org/10.1007/BF01699465; see also C. Wrathall, LNCS 572 (1992) 237-246), combined with L. J. Guibas, A. M. Odlyzko, JCTA 30 (1981) 183-208. Kurth's criterion is an iff; the converse is CLM-C01-11. The Lean overlap lemma is a verification asset, not new mathematics."
    change_reason: Historian novelty audit 2026-10-18 (reviews/historian_C01_C02.md, section 2)
    applications: Exact information content of words modulo an invisible local rewrite (e.g. log2(phi) bits/symbol modulo aab = aba).
  - id: CLM-C01-07
    type: theorem
    system: SYS-A
    title: Common-border formula proved for 1632 specific relations by verified finite completions
    statement: |
      For each of the 1632 relations marked PROVEN in results/EXP-C01-07.json (binary k <= 6, ternary k <= 4),
      the class-count generating function equals c(x)/(x^k + (1 - q x) c(x)), c the common-border polynomial.
    verification: PROVEN
    proof_check: computer-assisted (Python) - independently re-verified convergent completion, Aho-Corasick automaton, recurrence-order bound s+k; brute-force cross-check n <= 8; not Lean-checked
    proof: proofs/paper/C01.md#theorem-6-clm-c01-07--computer-assisted-proofs-for-1632-specific-relations
    evidence: [EXP-C01-07]
    novelty: REDISCOVERY
    novelty_basis: "Of the 1632 relations, 833 are instances of the containment theorem (Kurth 1987 + Guibas-Odlyzko) and 787 have no common border (published c = 1 case, see CLM-C01-09); only 12 (one common border each) fall in the unpublished case (CLM-C01-10). The method (finite completion, automaton of normal words, rational series) is Ufnarovski's framework (Encycl. Math. Sci. 57, 1995)."
    change_reason: Historian novelty audit 2026-10-18 (reviews/historian_C01_C02.md)
  - id: CLM-C01-08
    type: conjecture
    system: SYS-A
    title: "Common-border conjecture: one-relation class counts depend only on common borders"
    statement: |
      For all words u != v of equal length k over a q-letter alphabet, the number of congruence classes of
      length-n words modulo u = v has generating function c(x) / (x^k + (1 - q x) c(x)), where
      c(x) = 1 + sum over words b that are borders of both u and v of x^(k - |b|).
    verification: COMPUTATIONALLY SUPPORTED
    evidence: [EXP-C01-05, EXP-C01-06, EXP-C01-07]
    novelty: POTENTIALLY NOVEL
    novelty_basis: "Novel only in the case 'common border without containment'. The case with no common border (c = 1) follows from R. D. Gray, B. Steinberg, Forum Math. Sigma 14 (2026) e58, Thm 8.1 (https://doi.org/10.1017/fms.2026.10209) with Anick's strong freeness, and for different first/last letters from M. Albenque, P. Nadeau, FPSAC 2009 Cor. 3 + Adjan (CLM-C01-09); the containment case is Kurth 1987 (CLM-C01-06). The homological counterpart of the common-border dichotomy is Gray-Steinberg, Selecta Math. 28 (2022) art. 59, Thm B (https://doi.org/10.1007/s00029-022-00773-3). Searched without finding the growth formula: Anick, Piontkovski, Iyudu-Shkarin, Ufnarovski, Cain-Gray-Malheiro, Nyberg-Brodda survey, Rigo, OEIS (Historian audit)."
    limitations: "Case c = 1 settled by the literature (pending the Skeptic's check of the deduction), one common border derived from Gray-Steinberg 2022 identities (CLM-C01-10, pending check); two or more common borders open (checked for three k = 8 relations up to n = 13, EXP-C01-08)."
    change_reason: Historian novelty audit 2026-10-18 - claim split into CLM-C01-09/10/11

  - id: CLM-C01-09
    type: theorem
    system: SYS-A
    title: Common-border formula when u and v share no border (c = 1) - consequence of published results
    statement: |
      If u != v have length k over a q-letter alphabet and no word is a border of both, the class counts of length-n
      words modulo u = v have generating function 1/(1 - q x + x^k).
    verification: COMPUTATIONALLY SUPPORTED
    evidence: [EXP-C01-06, EXP-C01-07, EXP-C01-08]
    novelty: REDISCOVERY
    novelty_basis: "Derived by the Historian from Gray-Steinberg 2026 Thm 8.1 (no common border => Hochschild cohomological dimension <= 2 => gl.dim K<A>/(u-v) <= 2 => u - v strongly free, Anick 1982 => Hilbert series 1/(1-qx+x^k)); for different first or last letters also Albenque-Nadeau 2009 Cor. 3 + Adjan's cancellativity. All 527 relations left open by EXP-C01-07 are in this case."
    limitations: The deduction from the cited theorems is pending an independent Skeptic check; until then the status stays COMPUTATIONALLY SUPPORTED (1314 hard relations up to n = 12 / 7).
  - id: CLM-C01-10
    type: conjecture
    system: SYS-A
    title: Common-border formula with exactly one common border (derivation sketch from Gray-Steinberg 2022)
    statement: |
      If u != v of length k share exactly one common border z (neither border set containing the other), the class
      counts have generating function c/(x^k + (1 - q x) c) with c = 1 + x^(k - |z|).
    verification: COMPUTATIONALLY SUPPORTED
    evidence: [EXP-C01-06, EXP-C01-07, EXP-C01-08]
    novelty: POTENTIALLY NOVEL
    novelty_basis: "Historian derivation (reviews/historian_C01_C02.md, section 2 (C)): identities (P) H = G_y + x^(k-|y|) G_z and (E) H(1 - qx) + x^k G_z = 1 read off Gray-Steinberg 2022 Thm 6.6 and Props 8.3, 8.5 (G_w = growth series of the left ideal M[w]); for y = z they give the formula. No published statement of the growth formula found."
    limitations: Derivation not yet checked by the Skeptic; verified for the 12 lab relations (all n, by finite completion) and further relations by the Historian.
  - id: CLM-C01-11
    type: theorem
    system: SYS-A
    title: "Converse of border containment: u -> v (|u| = |v|) is confluent iff Borders(u) is contained in Borders(v)"
    statement: For words u != v of equal length, the one-rule system {u -> v} is confluent if and only if every border of u is a border of v.
    verification: COMPUTATIONALLY SUPPORTED
    evidence: [EXP-C01-08]
    novelty: REDISCOVERY
    novelty_basis: Kurth (1987) proves the iff for one-rule systems with the chain condition (length-preserving case); not re-proved by the lab. EXP-C01-08 finds no mismatch among 28,850 ordered pairs (binary k <= 7, ternary k <= 4); the Historian's scratch run found none among 152,928.

journal:
  - key: C01-01
    agent: Research Director
    kind: decision
    text: Opened Branch A with the question "can quantity be derived from transformations alone?" Chose the swap system and one-symbol relations as minimal test beds; meta-level use of ordinary mathematics declared explicitly in SYSTEMS.md section 0.
    refs: [research/systems/SYSTEMS.md]
  - key: C01-02
    agent: Mathematical Inventor
    kind: hypothesis
    text: Proposed H-C01-1 (counting is the complete invariant of commutation), H-C01-2/3 (one-symbol relations give threshold-plus-cycle structures) and the emergence of multiplication as composition.
    refs: [EXP-C01-01, EXP-C01-02, EXP-C01-03]
  - key: C01-03
    agent: Mathematical Explorer
    kind: result
    text: EXP-C01-01..03 confirmed all three on exhaustive finite slices (25 slices; 6159 relation sets with two independent algorithms; all semiring laws on a^0..a^12). Two-symbol substitutions do not commute in 154/200 random pairs.
    refs: [EXP-C01-01, EXP-C01-02, EXP-C01-03]
  - key: C01-04
    agent: Mathematical Inventor
    kind: hypothesis
    text: Proposed the deliberately bold H-C01-4 - any single rearranging relation eventually generates counting equivalence.
    refs: [CLM-C01-05]
  - key: C01-05
    agent: Mathematical Skeptic
    kind: rejection
    text: H-C01-4 rejected. EXP-C01-04 found counterexamples for all 33 relations of length 3 and 4; the simplest is aab <-> aba, under which baa is isolated.
    refs: [EXP-C01-04, CLM-C01-05]
  - key: C01-06
    agent: Mathematical Explorer
    kind: surprise
    text: The class counts in EXP-C01-04 were not random - every length-3 relation gave 2,4,7,12,20,33,... = F(n+3)-1 and 25 of the 27 length-4 relations gave tribonacci partial sums, while aaba<->abaa (and its complement) gave 97 instead of 96 at n = 7.
    refs: [EXP-C01-04]
  - key: C01-07
    agent: Mathematical Explorer
    kind: hypothesis
    text: Explanation proposed (H-C01-5) - if u is unbordered, u -> v has no critical pairs and terminates by lexicographic monotonicity, so classes are u-avoiding words (Guibas-Odlyzko count 1/(1-qx+x^k)). The exceptional pair has both sides bordered.
    refs: [EXP-C01-05]
  - key: C01-08
    agent: Formal Verifier
    kind: result
    text: EXP-C01-05 tested H-C01-5 on 1037 relations (binary k<=5, ternary k<=3) - 0 failures among 756 with an unbordered side; 81 both-bordered relations deviate.
    refs: [EXP-C01-05]
  - key: C01-09
    agent: Mathematical Explorer
    kind: pattern
    text: All 81 deviations share a common border between u and v, and their counts match avoidance of a word whose borders are exactly the common borders. Formulated H-C01-7 (common-border conjecture).
    refs: [EXP-C01-05, CLM-C01-08]
  - key: C01-10
    agent: Formal Verifier
    kind: proof
    text: Proved the border-containment theorem (Borders(u) in Borders(v) implies {u -> v} convergent) - the overlap along a common border joins in one step on each side. The one-step joinability identity is checked in Lean (common_border_joinable).
    refs: [CLM-C01-06, proofs/lean/Infinity/C01_Quantity.lean]
  - key: C01-11
    agent: Formal Verifier
    kind: result
    text: EXP-C01-06 confirmed H-C01-7 on 2159 relations including 1326 hard ones. EXP-C01-07 turned 1632 of them into proofs for all n (finite completion re-verified independently, rational generating function, recurrence-order bound). 527 hard relations have infinite completions, e.g. aba <-> bab completes to b a^j b a -> a b a a b^(j-1).
    refs: [EXP-C01-06, EXP-C01-07, CLM-C01-07]
  - key: C01-12
    agent: Formal Verifier
    kind: proof
    text: Lean 4 + Mathlib proofs compiled with standard axioms only - commEq_iff_count, projection_is_unary, gen_iff, exactly_m_add_p_classes, common_border_joinable.
    refs: [proofs/lean/Infinity/C01_Quantity.lean]
  - key: C01-13
    agent: Historian and Novelty Analyst
    kind: novelty
    text: Theorems 1-4 are textbook rediscoveries (Parikh vectors, monogenic semigroups, endomorphisms of N). Theorem 5 is very likely folklore (Newman + critical pairs + Guibas-Odlyzko). Two quick searches found no general common-border formula; CLM-C01-08 marked POTENTIALLY NOVEL pending a deeper audit.
    refs: [CLM-C01-06, CLM-C01-08]
  - key: C01-14
    agent: Mathematical Skeptic
    kind: review
    text: Caution recorded - the computer-assisted proofs (CLM-C01-07) trust the Python implementation; the guard is an independent convergence re-check plus brute-force agreement for n <= 8. Written proofs of CLM-C01-03/04/06 still need an independent review.
    refs: [CLM-C01-07]
  - key: C01-15
    agent: Historian and Novelty Analyst
    kind: novelty
    text: Independent novelty audit (reviews/historian_C01_C02.md) - CLM-C01-06 is the length-preserving case of Kurth's 1987 one-rule confluence criterion (an iff); the no-common-border case of the common-border formula follows from Gray-Steinberg 2026 Thm 8.1 plus Anick; all 527 relations we could not prove are in that case. Only 'common border without containment' remains unpublished, and identities derived from Gray-Steinberg 2022 settle the one-common-border case modulo a check.
    refs: [CLM-C01-06, CLM-C01-08, CLM-C01-09, CLM-C01-10]
  - key: C01-16
    agent: Research Director
    kind: revision
    text: Novelty labels revised - CLM-C01-05/06/07 to REDISCOVERY; CLM-C01-08 narrowed to the common-border-without-containment case and split into CLM-C01-09 (c = 1, rediscovery), CLM-C01-10 (one common border, potentially novel) and CLM-C01-11 (converse, Kurth). The Historian's deductions were sent to the independent Skeptic for checking; statuses stay COMPUTATIONALLY SUPPORTED until then.
    refs: [CLM-C01-08, CLM-C01-09, CLM-C01-10, CLM-C01-11]
  - key: C01-17
    agent: Mathematical Skeptic
    kind: review
    text: The audit's computations were run outside the repository; EXP-C01-08 reproduces them inside the lab (0 mismatches for the confluence criterion; 527/527 open relations with c = 1; 12 one-common-border relations; k = 8 two-common-border relations agree up to n = 13).
    refs: [EXP-C01-08]

