cycle: C08
title: Circle multiplications on recurrence numeration systems
branch: C
status: complete
systems: [SYS-C, SYS-B]

experiments:
  - id: EXP-C08-01
    analysis: Associativity of digit-convolution products is common at larger shifts and absent for some families at every shift; motivated the Pisot hypothesis.
    related: [CLM-C08-05, CLM-C08-06]
  - id: EXP-C08-02
    analysis: All 10 non-Pisot sequences fail at every shift 0..8; geometric ones never fail; Pisot ones become associative above thresholds growing with |beta|.
    related: [CLM-C08-02, CLM-C08-03, CLM-C08-05]
  - id: EXP-C08-03
    analysis: "Associative pairs survive inputs up to 1e6 (Knuth up to 1e9); slow Pisot systems become associative at shifts 7-10; non-monotone shift sets are genuine. CORRECTED by EXP-C08-06 - random triples missed rare failures; several of these 'associative' shifts are certified non-associative, and two of the non-monotone examples were artefacts."
    related: [CLM-C08-03, CLM-C08-04, CLM-C08-05]
  - id: EXP-C08-04
    analysis: "Positive conjugate root implies upward-closed shift sets in all 30 cases; all 10 non-monotone cases have a negative conjugate root. CORRECTED by EXP-C08-06 - 6 rows listed shifts that are certified non-associative; after the certified re-test 10 rows are still non-monotone, all with beta < 0 and non-canonical initial values."
    related: [CLM-C08-04]
  - id: EXP-C08-05
    analysis: The implementation reproduces OEIS A101330 (Knuth's circle product table).
    related: [CLM-C08-01]
  - id: EXP-C08-06
    analysis: "Certified re-test after the Historian's audit - an exact embedding filter (circle product as multiplication in Z[x]/(characteristic polynomial)) and explicit failing triples. Certified thresholds (largest failing shift / first shift without a failure found) - Fibonacci 1/2, Pell 0/1, (2,2;1,2) 5/6, tribonacci 3/4, 4-bonacci 7/8, G(k+1) = G(k) + G(k-2) 10/11, (3,3;1,5) 9/10. Upper values are 'no failure found', not proofs. Of the 90 quadratic rows of EXP-C08-04, 6 had certified-failing 'associative' shifts; 10 remain non-monotone, none with beta > 0."
    related: [CLM-C08-03, CLM-C08-04, CLM-C08-05, CLM-C08-07]
  - id: EXP-C08-07
    analysis: "After the Skeptic's review - targeted search at extreme conjugates (candidates with extreme conjugate coordinates, pool pairs whose product conjugate leaves an occupancy grid of the window, literature and Historian pairs as seeds; minimal recurrence by Berlekamp-Massey). Certified failures re-found for every named sequence, including the two the Skeptic reported against EXP-C08-06 ((2,2;1,2) at s = 6; (3,3;1,5) at s = 10, 11). Largest certified failing shift / first shift without failure (s <= 16) - Fibonacci 1/2, Pell 0/1, (2,2;1,2) 6/7, (3,3;1,5) 11/12, tribonacci 3/4, 4-bonacci 7/8, G(k+1) = G(k) + G(k-2) 10/11, G(k+1) = G(k) + G(k-3) fails at every s <= 16. Atlas of 46 sequences - no non-Pisot sequence has a shift without failure (s <= 12). 90 quadratic rows - 27 have newly certified failures at shifts EXP-C08-06 had passed; 8 rows non-monotone on 0..12, all with beta < 0 and non-canonical initial values (0 of 30 beta > 0 rows). 0 uncertified embedding failures. The window filter cannot see failures within one grid cell of the fractal window boundary; the tribonacci failure at s = 3 is found only through the literature seed."
    related: [CLM-C08-02, CLM-C08-03, CLM-C08-04, CLM-C08-05, CLM-C08-07, CLM-C08-08]

claims:
  - id: CLM-C08-01
    type: theorem
    system: SYS-C
    title: Every shifted Knuth product a o_t b = sum F(k+l+t) over Zeckendorf indices is associative (t >= 0)
    statement: |
      For every t >= 0 the operation a o_t b = sum_{k in Z(a)} sum_{l in Z(b)} F_(k+l+t) on the natural numbers
      (Z(n) the Zeckendorf index set, indices >= 2) is associative and commutative; in the lab's G-indexing these
      are the shifts s = t + 2 >= 2. For s = 0 and s = 1 associativity fails ((2 o 4) o 4 != 2 o (4 o 4) for s = 0,
      (1 o 4) o 4 != 1 o (4 o 4) for s = 1).
    verification: PROVEN
    proof_check: Lean 4 + Mathlib (Infinity.C08.circ_assoc, circ_comm, key, window; standard axioms only) for all t >= 0; counterexamples for s = 0, 1 by computation; no failure in 20,000 random triples up to 1e9 (t = 0)
    proof: proofs/paper/C08.md#theorem-1-clm-c08-01--every-shifted-knuth-product-is-associative
    lean: [proofs/lean/Infinity/C08_Knuth.lean]
    evidence: [EXP-C08-01, EXP-C08-03, EXP-C08-05]
    novelty: REDISCOVERY
    novelty_basis: "Knuth 1988; Arnoux 1989; all shifts s >= 2 and the failures at s = 0, 1 are in A. Messaoudi, Math. Slovaca 50 (2000), Thm 6 and Prop 1 (Historian audit 2026-10-18, reviews/historian_C03_C10.md). The Lean proof is a verification asset."
    change_reason: "Historian audit 2026-10-18 (reviews/historian_C03_C10.md)"
  - id: CLM-C08-02
    type: conjecture
    system: SYS-C
    title: Circle products over non-Pisot base sequences are never associative
    statement: |
      If the minimal linear recurrence of an increasing base sequence G (G_0 = 1) has a dominant root alpha > 1 and
      another characteristic root beta with |beta| >= 1 (counted with multiplicity: a repeated dominant root counts as
      such a beta), then the circle product o_s is non-associative for every s >= 0.
    verification: COMPUTATIONALLY SUPPORTED
    evidence: [EXP-C08-02, EXP-C08-07]
    novelty: "POTENTIALLY NOVEL"
    limitations: "10 non-Pisot sequences, shifts 0..8 (EXP-C08-02); the 10 again with certified failures at every s <= 12 (EXP-C08-07); the Skeptic adds 8 more non-Pisot sequences and the double root (x - 2)^2, all failing at every tested shift (s <= 25, resp. 12). The condition alpha > 1 is needed - G_k = k + 1 (minimal polynomial (x - 1)^2) gives a o_s b = a + b + s - 1, associative at every shift; the first wording, without it, was false (Skeptic review 2026-10-18)."
    change_reason: "Skeptic review 2026-10-18 (reviews/skeptic_C05_C08_C12.md, P10) - the statement needs a dominant root > 1; evidence extended by EXP-C08-07"
    novelty_basis: "As a conjecture, low confidence - not found; natural attack via Messaoudi's Cor 1 (window stability); related: property (F) implies Pisot (Frougny-Solomyak 1992) (Historian audit 2026-10-18, reviews/historian_C03_C10.md)."
  - id: CLM-C08-03
    type: theorem
    system: SYS-C
    title: Recurrences with non-increasing coefficients and canonical initial values give associative circle products for large shifts
    statement: |
      For base sequences G_k = a_1 G_(k-1) + ... + a_d G_(k-d) with a_1 >= a_2 >= ... >= a_d >= 1 and canonical
      initial values (the conditions of Grabner-Petho-Tichy-Woeginger 1994), the circle product o_s is
      associative once the shift s is large enough. (The earlier title, "Pisot base sequences ...", overstated
      the published theorem.)
    verification: COMPUTATIONALLY SUPPORTED
    evidence: [EXP-C08-02, EXP-C08-03, EXP-C08-06, EXP-C08-07]
    novelty: REDISCOVERY
    limitations: "The lab's supporting thresholds were twice too low (CLM-C08-05, CLM-C08-07); the targeted search EXP-C08-07 still finds a first associative shift for every Pisot sequence of the atlas except G(k+1) = G(k) + G(k-3), which fails at every s <= 16 (the Skeptic - s <= 24) and seems to lie outside the theorem's hypotheses (its coefficients 1, 0, 0, 1 are not non-increasing)."
    novelty_basis: "Published theorem (P. J. Grabner, A. Petho, R. F. Tichy, G. J. Woeginger, Appl. Math. Lett. 7 (1994) 85-90); see also A. Messaoudi, Math. Slovaca 50 (2000) 135-148 (window criterion, Thm 2-3). Not re-proved by the lab; our data agree for the sequences tested. The sequence G(k+1) = G(k) + G(k-3) (no associative shift <= 20) may be outside the theorem's hypotheses (Historian audit, reviews/historian_C03_C10.md)."
    change_reason: "Skeptic review 2026-10-18 (reviews/skeptic_C05_C08_C12.md) - supporting evidence replaced by the targeted search EXP-C08-07"
  - id: CLM-C08-04
    type: conjecture
    system: SYS-C
    title: Non-monotone associative-shift sets require a negative conjugate root
    statement: |
      For quadratic Pisot base sequences G(k+1) = pG(k) + qG(k-1) with non-canonical initial values (for canonical
      ones the associative shifts are upward closed whatever the sign of beta, by Messaoudi's Thm 2 as derived by
      the Historian): if the conjugate root beta is positive, the set of shifts s for which o_s is associative is
      upward-closed; sets that are not upward-closed (e.g. {2} and s >= 4 for G = 1,3,4,7,11,...) occur only when
      beta < 0.
    verification: COMPUTATIONALLY SUPPORTED
    evidence: [EXP-C08-07, EXP-C08-06, EXP-C08-04, EXP-C08-03]
    novelty: POTENTIALLY NOVEL
    novelty_basis: "Low confidence. Not found in Knuth 1988, Arnoux 1989, Grabner et al. 1994, Messaoudi 2000 (read in full) or Ambroz-Frougny-Masakova-Pelantova 2003. The Historian derives from Messaoudi's Thm 2 that for canonical (Parry) sequences the associative shifts are upward-closed whatever the sign of beta; so the phenomenon concerns non-canonical initial values only (reviews/historian_C03_C10.md)."
    limitations: "Re-tested with certificates (EXP-C08-06, the same 90 quadratic sequences, shifts 0..10) - 6 rows of EXP-C08-04 listed shifts that are certified non-associative, including two of the original non-monotone examples ((4,3;1,5) at s = 4, (3,3;1,2) at s = 7). After the re-test 10 rows are still non-monotone, all with non-canonical initial values and beta < 0; none of the 30 rows with beta > 0. Isolated 'associative' shifts are supported by search only (no proof). Note that for G(k+1) = pG(k) + qG(k-1) with q > 0 the conjugate root is automatically negative. The Skeptic's review found the evidence of EXP-C08-04 contaminated - 31 of its 90 rows (8 with beta > 0) list certified-failing shifts as associative, and 4 of its 10 non-monotone rows are artefacts. After the targeted search EXP-C08-07 (shifts 0..12) 8 rows are non-monotone, all with beta < 0 and non-canonical initial values, and none of the 30 beta > 0 rows; the Skeptic's stronger search finds 0 of 231 beta > 0 sequences non-monotone (s <= 16) and 60 of 396 beta < 0 ones, none canonical."
    change_reason: "Skeptic review 2026-10-18 (reviews/skeptic_C05_C08_C12.md, P3) - statement restricted to non-canonical initial values; evidence replaced by EXP-C08-07"
  - id: CLM-C08-05
    type: observation
    system: SYS-C
    title: Measured associativity thresholds for 46 base sequences (refuted - five of the eight quoted thresholds were too small)
    statement: |
      Smallest shift s0 with o_s associative for all tested s0 <= s <= max tested: Fibonacci 2, Pell (1,2,5) 1,
      G(k+1)=2G(k)+2G(k-1) (1,2) 5, tribonacci 3, 4-bonacci 7, G(k+1)=G(k)+G(k-2) 10, G(k+1)=3G(k)+3G(k-1) (1,5) 10;
      G(k+1)=G(k)+G(k-3) none up to 20 (full table in results/EXP-C08-02.json and EXP-C08-03.json).
    verification: REFUTED
    counterexample: "Certified violations (EXP-C08-06) - tribonacci s = 3: (10016 o 10016) o 1 = 3414681926 != 3414681924 = 10016 o (10016 o 1) (the example of Ambroz-Frougny-Masakova-Pelantova 2003); 4-bonacci s = 7: triple (623729, 581581, 1); G(k+1) = 2G(k) + 2G(k-1) (1,2) s = 5: triple (29957, 280628, 1); G(k+1) = G(k) + G(k-2) s = 10: triple (78, 248, 1) (found by the Historian). The random tests behind the measurement (triples up to 10^6) missed these rare failures. The Skeptic's review adds G(k+1) = 3G(k) + 3G(k-1) (1,5) at s = 10: (173938 o 173938) o 1 != 173938 o (173938 o 1) - the fifth wrong value. Thresholds after the targeted search in CLM-C08-08."
    evidence: [EXP-C08-02, EXP-C08-03, EXP-C08-06, EXP-C08-07]
    novelty: REDISCOVERY
    novelty_basis: "Partial rediscovery - thresholds known in the literature (Messaoudi 2000, 2002; Ambroz-Frougny-Masakova-Pelantova 2003 refute Arnoux's conjecture that tribonacci s = 3 works)."
    change_reason: "Skeptic review 2026-10-18 (reviews/skeptic_C05_C08_C12.md, P2) - a fifth wrong threshold; the sequence count is 46, not 45"
  - id: CLM-C08-06
    type: hypothesis
    system: SYS-C
    title: "H-C08-1: Knuth's associative circle product is an isolated case (refuted)"
    statement: Among digit-convolution products a o_s b = sum d_i d_j G_(i+j+s), only Fibonacci with s = 2 is associative.
    verification: REFUTED
    counterexample: "Fibonacci with s = 3 (t = 1) is associative by Theorem 1 (CLM-C08-01); geometric bases are associative for every s; many Pisot sequences are associative at larger shifts (EXP-C08-02)."
    evidence: [EXP-C08-01, EXP-C08-02]
    novelty: "REDISCOVERY"
    novelty_basis: "Grabner-Petho-Tichy-Woeginger 1994 and Messaoudi 2000 exhibit infinitely many associative circle products (Historian audit 2026-10-18, reviews/historian_C03_C10.md)."
    change_reason: "Historian audit 2026-10-18 (reviews/historian_C03_C10.md)"

  - id: CLM-C08-07
    type: observation
    system: SYS-C
    title: Corrected associativity thresholds - certified lower bounds and searched ranges
    statement: |
      For the circle product o_s: Fibonacci (1,2) fails for s <= 1 and is associative for s >= 2 (Lean, CLM-C08-01);
      Pell (1,2,5) fails at s = 0, no failure found for 1 <= s <= 5 (associative for s >= 1 by Messaoudi 2000);
      G(k+1) = 2G(k) + 2G(k-1) (1,2) fails for s <= 5, no failure found for 6 <= s <= 8; tribonacci (1,2,4) fails
      for s <= 3, no failure found for 4 <= s <= 9; 4-bonacci (1,2,4,8) fails for s <= 7, no failure found for
      8 <= s <= 10; G(k+1) = G(k) + G(k-2) (1,2,3) fails for s <= 10, no failure found for s = 11, 12;
      G(k+1) = 3G(k) + 3G(k-1) (1,5) fails for s <= 9, no failure found for 10 <= s <= 12. Every failure is
      certified by an explicit triple; every "no failure" is computational support only.
    verification: REFUTED
    counterexample: "Two of its 'no failure found' ranges were wrong (Skeptic review 2026-10-18, reviews/skeptic_C05_C08_C12.md, P2) - G(k+1) = 2G(k) + 2G(k-1) (1,2) fails at s = 6: (314965 o 314965) o 1 != 314965 o (314965 o 1); G(k+1) = 3G(k) + 3G(k-1) (1,5) fails at s = 10 and s = 11: (173938 o 173938) o 1 != 173938 o (173938 o 1). Both re-verified with the lab's code and re-found by EXP-C08-07 (e.g. (5653, 42197, 1) at s = 6; (3192, 173938, 1) at s = 10; (12100, 12100, 1) at s = 11). The certified lower bounds of this claim stand; the thresholds it implied for these two sequences do not. Superseded by CLM-C08-08."
    proof_check: "lower bounds certified by explicit triples (results/EXP-C08-06.json); upper bounds proved only where the literature proves them (Fibonacci s >= 2 Lean; Pell s >= 1 Messaoudi 2000 Thm 1; tribonacci s >= 6 per Messaoudi 2002 as reported by Ambroz-Masakova-Pelantova 2007, s >= 9 GPTW; 4-bonacci s >= 10 Messaoudi 2000 Remark 2)"
    evidence: [EXP-C08-06, EXP-C08-07]
    novelty: REDISCOVERY
    novelty_basis: "Partial - the tribonacci and 4-bonacci bounds are in the literature (Messaoudi 2000, 2002; AFMP 2003); the other values are the lab's measurements."
    limitations: "Search - all pairs a <= b < 300, 4000 random pairs below 10^6, literature and Historian examples, c < 300 for an explicit triple; 'no failure found' does not prove associativity. Tribonacci s = 4 and s = 5 are open in the sources read (the Historian derives s >= 5 from AFMP's bound on fractional digits and Messaoudi's Thm 2, unchecked). The lab's second attempt at these thresholds repeated the first one's mistake - searching where failures are rare."
    change_reason: "Skeptic review 2026-10-18 (reviews/skeptic_C05_C08_C12.md) - certified failures inside two of the 'no failure found' ranges"
  - id: CLM-C08-08
    type: observation
    system: SYS-C
    title: "Associativity thresholds after the targeted search - certified lower bounds, no failure up to s = 16"
    statement: |
      For the circle product o_s: Fibonacci (1,2) fails for s <= 1, associative for s >= 2 (Lean, CLM-C08-01); Pell
      (1,2,5) fails at s = 0 (associative for s >= 1, Messaoudi 2000); G(k+1) = 2G(k) + 2G(k-1) (1,2) fails for
      s <= 6; G(k+1) = 3G(k) + 3G(k-1) (1,5) fails for s <= 11; tribonacci (1,2,4) fails for s <= 3; 4-bonacci
      (1,2,4,8) fails for s <= 7; G(k+1) = G(k) + G(k-2) (1,2,3) fails for s <= 10; G(k+1) = G(k) + G(k-3) (1,2,3,4)
      fails for every s <= 16 (the Skeptic - every s <= 24). Every failure is certified by an explicit triple. Above
      these bounds no failure was found up to s = 16 by the targeted search of EXP-C08-07 and by the Skeptic's
      independent extreme-conjugate search - computational support only.
    verification: COMPUTATIONALLY SUPPORTED
    evidence: [EXP-C08-07, EXP-C08-06]
    novelty: REDISCOVERY
    novelty_basis: "Partial - the tribonacci and 4-bonacci bounds are in the literature (Messaoudi 2000, 2002; AFMP 2003); the other values are measurements. The Skeptic's independent search (reviews/skeptic_C05_C08_C12.md, P2 and Appendix C.1) gives the same lower bounds."
    limitations: "Two earlier versions of these thresholds (CLM-C08-05, CLM-C08-07) were refuted because failures are rare among random or small inputs. The targeted search is heuristic - its grid cannot see failures within one cell of the fractal window boundary (the tribonacci failure at s = 3 is found only through the literature seed), so the upper values may still be too low."

journal:
  - key: C08-01
    agent: Mathematical Inventor
    kind: hypothesis
    text: Proposed digit-position convolution ("circle") products on greedy numeration systems as an invented operation; devil's-advocate hypothesis H-C08-1 that Knuth's associative case is isolated.
    refs: [EXP-C08-01]
  - key: C08-02
    agent: Mathematical Explorer
    kind: surprise
    text: First run already shows associativity for Fibonacci at s = 3, 4, 5 and for many other sequences at larger shifts, with failure rates that do not depend smoothly on s.
    refs: [EXP-C08-01, CLM-C08-06]
  - key: C08-03
    agent: Mathematical Explorer
    kind: pattern
    text: Every persistent failure belongs to a sequence whose minimal recurrence has a second root on or outside the unit circle (e.g. roots 2 and -1). Degenerate initial conditions (powers of 2 from x^2 - x - 2) remove the bad root and restore associativity.
    refs: [EXP-C08-02, CLM-C08-02]
  - key: C08-04
    agent: Mathematical Skeptic
    kind: review
    text: Small-cube associativity is weak evidence; re-tested every candidate on random triples up to 1e6 and Knuth's product up to 1e9. The non-monotone shift sets survive.
    refs: [EXP-C08-03]
  - key: C08-05
    agent: Mathematical Explorer
    kind: hypothesis
    text: Proposed H-C08-4 - the sign of beta^s flips the product's conjugate and the greedy window is asymmetric, so non-monotonicity should need beta < 0. Confirmed on 90 quadratic Pisot sequences (30/30 positive-beta sets upward-closed).
    refs: [EXP-C08-04, CLM-C08-04]
  - key: C08-06
    agent: Formal Verifier
    kind: proof
    text: Wrote a complete proof that all shifted Knuth products (s >= 2) are associative using the explicit window (-psi^2, -psi) of conjugates of Zeckendorf sums; launched a Lean formalisation.
    refs: [CLM-C08-01, proofs/paper/C08.md]
  - key: C08-07
    agent: Historian and Novelty Analyst
    kind: novelty
    text: Eventual associativity for dominant-root recurrences is the theorem of Grabner, Petho, Tichy and Woeginger (1994); Knuth (1988) and Arnoux (1989) for Fibonacci. Our implementation reproduces OEIS A101330. Non-Pisot never-associativity and the sign-of-beta mechanism were not found in a first search.
    refs: [EXP-C08-05, CLM-C08-03, CLM-C08-04]
  - key: C08-08
    agent: Formal Verifier
    kind: proof
    text: Lean 4 + Mathlib formalisation of Theorem 1 completed by a dedicated Formal Verifier worker (proofs/lean/Infinity/C08_Knuth.lean, 256 lines) - circ_assoc and circ_comm for every shift t, via the twisted homomorphism E(circ t a b) = phi^t E(a) E(b) and a symmetric conjugate window |sum psi^k| < -psi. Standard axioms only. Knuth's theorem and its shifted versions are now machine-checked.
    refs: [CLM-C08-01, proofs/lean/Infinity/C08_Knuth.lean]

  - key: C08-09
    agent: Historian
    kind: contradiction
    text: "The tribonacci circle product is NOT associative at shift 3 - (10016 o 10016) o 1 = 3414681926 != 3414681924 = 10016 o (10016 o 1), the example by which Ambroz-Frougny-Masakova-Pelantova (2003) refuted Arnoux's conjecture; G(k+1) = G(k) + G(k-2) also fails at s = 10. The lab's random tests up to 10^6 missed both."
    refs: [CLM-C08-05, reviews/historian_C03_C10.md]
  - key: C08-10
    agent: Mathematical Skeptic
    kind: result
    text: 'EXP-C08-06 re-tested every threshold and the 90 quadratic rows with an exact embedding filter and explicit certificates - four of eight listed thresholds were too small (tribonacci, 4-bonacci, (2,2;1,2), G(k)+G(k-2)); 6 quadratic rows had listed shifts that are certified failures; Conjecture 9.2 survives (no positive-beta row is non-monotone; all 10 non-monotone rows have non-canonical initial values). CLM-C08-05 marked REFUTED, corrected values in CLM-C08-07.'
    refs: [EXP-C08-06, CLM-C08-04, CLM-C08-05, CLM-C08-07]
  - key: C08-11
    agent: Formal Verifier
    kind: revision
    text: "Lesson recorded for all cycles - random sampling of triples is not a reliable associativity test when failures are rare; use certificate-producing searches (exact embeddings, structured candidates, literature examples) and state 'no failure found' as support only."
    refs: [EXP-C08-06]

  - key: C08-12
    agent: Mathematical Skeptic
    kind: rejection
    text: "Independent review (reviews/skeptic_C05_C08_C12.md) - five of the eight thresholds of CLM-C08-05 fail with explicit triples, and the lab's own corrected values (EXP-C08-06, CLM-C08-07) are still too low for (2,2;1,2) and (3,3;1,5). Root cause - random or small inputs rarely hit the extreme-conjugate inputs that break associativity. CLM-C08-02 needs a dominant root > 1 (G_k = k + 1 is associative at every shift); the evidence of CLM-C08-04 is contaminated, its statement survives a stronger search."
    refs: [CLM-C08-02, CLM-C08-04, CLM-C08-05, CLM-C08-07, reviews/skeptic_C05_C08_C12.md]
  - key: C08-13
    agent: Mathematical Explorer
    kind: result
    text: "EXP-C08-07 - a targeted search (extreme conjugates, a window occupancy grid, known pairs as seeds, minimal recurrences) reproduces every certified failure of the review with the lab's own code; thresholds now (2,2;1,2) >= 7, (3,3;1,5) >= 12, tribonacci >= 4, 4-bonacci >= 8, G+G(k-2) >= 11 (CLM-C08-08); 8 non-monotone quadratic rows, all beta < 0 and non-canonical. Lesson for the lab - for rare failures, search where the theory says failures live."
    refs: [EXP-C08-07, CLM-C08-08, CLM-C08-04]

