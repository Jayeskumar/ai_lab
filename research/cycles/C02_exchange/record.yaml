cycle: C02
title: "Exchange systems: positional numeration as normal forms"
branch: A-C
status: complete
systems: [SYS-A, SYS-C]

experiments:
  - id: EXP-C02-01
    analysis: Binary..quinary carrying from unary numerals is order-independent; normal forms are base-b expansions and every complete derivation has (n - s_b(n))/(b - 1) exchanges.
    verification: PROVEN
    novelty: REDISCOVERY
    related: [CLM-C02-01, CLM-C02-02]
  - id: EXP-C02-02
    analysis: The Fibonacci exchange system reaches the Zeckendorf representation from every tested configuration; derivation lengths vary between n - z(n) and a larger maximum.
    related: [CLM-C02-09, CLM-C02-10]
  - id: EXP-C02-03
    analysis: Termination from unary starts holds exactly for the 31 rules with sum b < m; every one of the 158 other rules has a periodic-glider or monotone-pumping certificate; no radix-order inversion up to n = 3000.
    related: [CLM-C02-03, CLM-C02-04, CLM-C02-05, CLM-C02-08]
  - id: EXP-C02-04
    analysis: H-C02-4 refuted - four terminating rules have integers with several stable representations; merge-and-stabilise addition always agrees with rep(a+b).
    counterexamples: ["4[k] -> 2[k+1]: configurations 2 (two tokens at level 0) and 10 (one token at level 1) are both stable with value 2"]
    verification: REFUTED
    related: [CLM-C02-06]
  - id: EXP-C02-05
    analysis: Uniqueness holds for all 28 rules whose reduced carry polynomial is primitive and irreducible (over all stable configurations, not only integer-valued ones) and fails for the 3 non-primitive ones.
    related: [CLM-C02-07]
  - id: EXP-C02-07
    analysis: All 98 critical rules (m <= 5, J <= 4, b_j <= 4, gcd-1 support) have a simple eigenvalue 1 and all other eigenvalues of modulus < 1 (max 0.949); every start beyond the largest terminating one (<= 124) is certified non-terminating - as Theorem 9 predicts.
    related: [CLM-C02-04, CLM-C02-11]
  - id: EXP-C02-06
    analysis: Base 3/2 = A024629 and shortest Fibonacci derivations = A219641 (rediscoveries); longest Fibonacci derivations and exotic-base representations have no OEIS match. The A089881 hit for representation lengths is a spurious shifted-window coincidence.
    related: [CLM-C02-09, CLM-C02-10]

claims:
  - id: CLM-C02-01
    type: theorem
    system: SYS-A
    title: Integer bases emerge as normal forms of the exchange rule b[k] -> [k+1]
    statement: |
      From n tokens at level 0, every maximal derivation of the rule "b tokens at level k -> 1 token at level k+1"
      (b >= 2) is finite, ends at the base-b expansion of n, and has exactly (n - s_b(n))/(b - 1) steps.
    verification: PROVEN
    proof_check: written proof (proofs/paper/C02.md Theorem 2), skeptic-reviewed 2026-10-18 (reviews/skeptic_C01_C02.md); exhaustive check of 134 derivation graphs and n <= 20000; Skeptic enumerated all derivations for b = 2..7, 360 cases
    proof: proofs/paper/C02.md#theorem-2-clm-c02-01--integer-bases
    evidence: [EXP-C02-01]
    novelty: REDISCOVERY
    novelty_basis: "Chip-firing on a path / standard carrying; the step count sum_i floor(n/b^i) = (n - s_b(n))/(b - 1) is Legendre's identity."
    change_reason: Independent skeptic review 2026-10-18 (reviews/skeptic_C01_C02.md) - proof upheld
  - id: CLM-C02-02
    type: theorem
    system: SYS-A
    title: Abelian property of carry rules (order of exchanges is irrelevant)
    statement: |
      For a carry rule m[k] -> sum_j b_j [k+j], one-step firings at different levels commute. Hence from any
      configuration either all maximal derivations are infinite or all are finite with the same endpoint,
      length and firing vector.
    verification: PROVEN
    proof_check: written proof (proofs/paper/C02.md Theorem 1), skeptic-reviewed 2026-10-18 (reviews/skeptic_C01_C02.md); induction cited from Bjorner-Lovasz-Shor; 1500 random rules, 0 violations
    proof: proofs/paper/C02.md#theorem-1-clm-c02-02--the-abelian-property
    evidence: [EXP-C02-01, EXP-C02-04]
    novelty: REDISCOVERY
    novelty_basis: Strong convergence of chip-firing (Bjorner-Lovasz-Shor 1991); abelian sandpile (Dhar 1990); abelian networks (Bond-Levine).
    change_reason: Independent skeptic review 2026-10-18 (reviews/skeptic_C01_C02.md) - proof upheld
  - id: CLM-C02-03
    type: theorem
    system: SYS-C
    title: Termination dichotomy for carry rules away from sum b = m
    statement: |
      If sum_j b_j < m every derivation from every configuration terminates. If sum_j b_j > m, the emergent base
      satisfies r < 1 and no derivation from n tokens at level 0 terminates when n > (m - 1)/(1 - r).
    verification: PROVEN
    proof_check: written proof (proofs/paper/C02.md Theorem 3), skeptic-reviewed 2026-10-18 (reviews/skeptic_C01_C02.md)
    proof: proofs/paper/C02.md#theorem-3-clm-c02-03--termination-dichotomy-away-from-b--m
    evidence: [EXP-C02-03]
    novelty: REDISCOVERY
    novelty_basis: "Folklore monovariants (token count; conserved value): chip-firing with a sink (Bjorner-Lovasz, J. Algebraic Combin. 1 (1992) 305-328); half-line analogue of the halting criterion of Bond-Levine, Abelian networks II, Selecta Math. 22 (2016) 319-340; Tanton's Exploding Dots machines 'fire off to infinity'. Not found verbatim, but a two-line consequence of standard arguments."
    change_reason: Independent skeptic review 2026-10-18 (reviews/skeptic_C01_C02.md) - proof upheld
  - id: CLM-C02-04
    type: theorem
    system: SYS-C
    title: "Carry rules with sum b = m never terminate from all unary starts (uniform glider)"
    statement: |
      For every carry rule with sum_j b_j = m there is a unary start n whose sweep reaches a window dominating the
      uniform-firing glider T = (T_1, ..., T_J), T_i = sum_{j >= i} b_j (if g = gcd{j : b_j > 0} > 1: the glider T'
      of the reduced rule b'_i = b_(gi) on the levels g*N); consequently its derivations from n are infinite. In fact
      every unary start n >= t*·m has this property (Theorems 9-10).
    verification: PROVEN
    proof_check: two independent written proofs - proofs/paper/C02.md Theorem 9 (spectral, by the Director) and Theorem 10 (Perron-Frobenius, by the Skeptic, checked line by line by the Director/Formal Verifier 2026-10-18); corroborated by EXP-C02-03, EXP-C02-07 and the Skeptic's simulation of 668,793 aperiodic critical rules
    proof: proofs/paper/C02.md#theorem-9-clm-c02-11--critical-rules-never-terminate-from-large-starts
    evidence: [EXP-C02-03]
    novelty: POTENTIALLY NOVEL
    novelty_basis: "Closest prior work - J. Propp, 'How do you write one hundred in base 3/2?' (2017, endnote 3) proposes the family m -> p(x) with no results; Borodin et al., Minnesota J. Undergrad. Math. 6 (2021) (two-directional firing, always terminating); Bond-Levine 2016 (critical case, finite networks only). No statement of the uniform glider found (low-medium confidence)."
    limitations: Theorem 10 gives an explicit but crude bound t* (via a Wielandt exponent); observed n0 <= 125 for the 98 rules of EXP-C02-07; largest first gliding t found by the Skeptic is 2744.
    change_reason: Second independent proof (Skeptic, Appendix A) checked by the Director; statement made precise for g > 1 (skeptic review 2026-10-18)
  - id: CLM-C02-05
    type: theorem
    system: SYS-C
    title: Termination classification for all 189 small carry rules (computer-assisted)
    statement: |
      Among the 189 carry rules with m in {2,3,4}, J <= 3, b_j <= 3, exactly the 31 with sum b < m terminate from
      every unary start; each of the other 158 has a unary start n <= 200 with an infinite derivation.
    verification: PROVEN
    proof_check: computer-assisted (Python) - explicit periodic-glider or monotone-pumping certificates for 158 rules; Theorem 3(a) for the 31 others
    proof: proofs/paper/C02.md#theorem-5-clm-c02-05--certificates-for-the-surveyed-rules-computer-assisted
    evidence: [EXP-C02-03]
    novelty: POTENTIALLY NOVEL
    novelty_basis: Minor - the 31 terminating and 130 sum-b > m rules follow from CLM-C02-03; only the 28 certificates for sum b = m are new data (instances of CLM-C02-04).
    change_reason: Historian novelty audit 2026-10-18 (reviews/historian_C01_C02.md, section 3)
  - id: CLM-C02-06
    type: hypothesis
    system: SYS-C
    title: "H-C02-4: every terminating carry rule gives unique stable representations (refuted)"
    statement: For every carry rule with sum b < m, each integer has exactly one stable configuration of that value.
    verification: REFUTED
    counterexample: "4[k] -> 2[k+1] (base 2 with digits 0..3): the stable configurations '2' and '10' both have value 2. Also 4[k] -> [k+2] on all levels, 4[k] -> 2[k+2], 4[k] -> 2[k+3] (EXP-C02-04)."
    evidence: [EXP-C02-04]
    novelty: REDISCOVERY
    novelty_basis: Classical redundancy of digit sets larger than the base (A. Avizienis, IRE Trans. Electron. Comput. EC-10 (1961) 389-400); Akiyama-Frougny-Sakarovitch assume gcd(p, q) = 1 precisely to exclude it.
    change_reason: Historian novelty audit 2026-10-18 (reviews/historian_C01_C02.md, section 3)
  - id: CLM-C02-07
    type: theorem
    system: SYS-C
    title: Uniqueness of representations when the reduced carry polynomial is primitive and irreducible
    statement: |
      Let g = gcd{j : b_j > 0} and P~(y) = sum_i b_(gi) y^i - m. If P~ is primitive and irreducible over Q, then
      distinct stable configurations supported on multiples of g have distinct values; in particular, if
      sum_j b_j < m, every n has exactly one stable representation there, namely rep(n). If P~ is not primitive
      and sum_j b_j <= m (more generally every b_(gi) < m*d, d the content of P~), two such configurations with
      equal value exist.
    verification: PROVEN
    proof_check: Lean 4 + Mathlib for the polynomial core (digits_unique, exists_large_coeff; standard axioms only); reduction to the lattice and the converse by written proof, skeptic-reviewed 2026-10-18 (reviews/skeptic_C01_C02.md); statement restricted after the review (the converse fails for 2[k] -> 4[k+1], existence fails for 2[k] -> 3[k+1])
    proof: proofs/paper/C02.md#theorem-7-clm-c02-07--uniqueness-of-representations
    lean: [proofs/lean/Infinity/C02_Exchange.lean]
    evidence: [EXP-C02-05]
    novelty: REDISCOVERY
    novelty_basis: "In substance S. Akiyama, C. Frougny, J. Sakarovitch, Israel J. Math. 168 (2008) 53-91, Lemma 5 (the same Gauss-lemma and constant-term argument for qX - p) transplanted to sum b_j y^j - m; general framework K. Scheicher, P. Surer, J. Thuswaldner, C. van de Woestijne, Digit systems over commutative rings, IJNT 10 (2014) 1459-1483; monic ancestor Kovacs-Petho (1991). The Lean formalisation is a verification asset."
    change_reason: Skeptic review 2026-10-18 (reviews/skeptic_C01_C02.md) - statement restricted, existence needs sum b < m and the converse sum b <= m
  - id: CLM-C02-08
    type: theorem
    system: SYS-C
    title: Exchange representations respect the radix order
    statement: For every carry rule with sum b < m and every n, rep(n) < rep(n+1) in radix order.
    verification: PROVEN
    proof_check: written proof (proofs/paper/C02.md Theorem 6, gap closed by the highest-firing-level argument), skeptic-reviewed 2026-10-18 (reviews/skeptic_C01_C02.md); 0 inversions for 31 rules up to n = 3000 and (Skeptic, LIFO order) 448 rules up to n = 1500
    proof: proofs/paper/C02.md#theorem-6-clm-c02-08--representations-respect-the-radix-order
    evidence: [EXP-C02-03]
    novelty: REDISCOVERY
    novelty_basis: In substance AFS 2008 Prop. 11 (radix order agrees with numerical order for rational bases) via the odometer argument; the general rule was not found verbatim.
    change_reason: Skeptic review 2026-10-18 (reviews/skeptic_C01_C02.md) - proof gap closed by the highest-firing-level argument
  - id: CLM-C02-09
    type: theorem
    system: SYS-C
    title: The Fibonacci exchange system terminates at the Zeckendorf representation; shortest derivation n - z(n)
    statement: |
      With weights 1,2,3,5,8,..., the exchanges [k]+[k+1] -> [k+2], 2[k] -> [k+1]+[k-2] (k >= 2), 2[1] -> [2]+[0],
      2[0] -> [1] terminate from every configuration at the Zeckendorf representation of its value, and the
      shortest derivation from n tokens at level 0 has n - z(n) steps (z(n) = number of Zeckendorf terms).
    verification: PROVEN
    proof_check: written proof (proofs/paper/C02.md Theorem 8), skeptic-reviewed 2026-10-18 (reviews/skeptic_C01_C02.md); exhaustive check of 2167 configurations (Skeptic - 6617, own code)
    proof: proofs/paper/C02.md#theorem-8-clm-c02-09--the-fibonacci-exchange-system-zeckendorf-game
    evidence: [EXP-C02-02, EXP-C02-06]
    novelty: REDISCOVERY
    novelty_basis: The Zeckendorf game (Baird-Smith, Epstein, Flint, Miller, arXiv:1809.04881) - termination and shortest game N - Z(N); OEIS A219641.
    change_reason: Independent skeptic review 2026-10-18 (reviews/skeptic_C01_C02.md) - proof upheld
  - id: CLM-C02-10
    type: observation
    system: SYS-C
    title: Longest Fibonacci exchange derivations (longest Zeckendorf games) for n <= 40
    statement: |
      The maximum number of exchanges from n tokens at level 0 is, for n = 1..40: 0,1,2,3,5,6,8,10,11,13,15,17,
      20,21,23,25,26,29,31,34,37,38,40,42,44,47,48,50,53,54,57,60,63,67,68,70,72,73,76,78 (exhaustive search).
    verification: PROVEN
    proof_check: computer-assisted exhaustive search of the full derivation graph (EXP-C02-02)
    proof: results/EXP-C02-02.json (max_len_seq)
    evidence: [EXP-C02-02, EXP-C02-06]
    novelty: REDISCOVERY
    novelty_basis: "Published - Baird-Smith, Epstein, Flint, Miller, The Zeckendorf Game (PROMS 297, 2020; arXiv:1809.04881) Figs 3-4 list the longest games for n <= 49 (identical to our n <= 40); Cusenza et al., Fibonacci Quart. 60 (2022) prove the greedy strategy optimal and give a closed form only for n = F_k - 1; Cheigh et al. (PROMS 2025) state the general closed form is open. The sequence is not yet in the OEIS (possible documentation contribution)."
    change_reason: Historian novelty audit 2026-10-18 - correct the basis (values already published)

  - id: CLM-C02-11
    type: theorem
    system: SYS-C
    title: "Termination classification of carry rules: terminating from every unary start iff sum b < m"
    statement: |
      A carry rule m[k] -> sum_j b_j [k+j] terminates from every unary start iff sum_j b_j < m. If sum_j b_j = m,
      every derivation from n tokens at level 0 is infinite for all sufficiently large n (the sweep window converges,
      up to bounded error, to a large multiple of the tail-sum vector T and then dominates T).
    verification: PROVEN
    proof_check: written proofs (proofs/paper/C02.md Theorem 3, skeptic-reviewed; Theorems 9 and 10 - two independent proofs of the critical case, Theorem 10 by the Skeptic and checked by the Director); 98 critical rules checked for all starts <= 2000 (EXP-C02-07)
    proof: proofs/paper/C02.md#theorem-9-clm-c02-11--critical-rules-never-terminate-from-large-starts
    evidence: [EXP-C02-03, EXP-C02-07]
    novelty: POTENTIALLY NOVEL
    novelty_basis: "Historian audit found no equivalent for the critical case (closest - Propp 2017 proposed the rule family; Bond-Levine, Abelian networks II (2016) prove the analogous critical-case non-halting for FINITE networks via the spectral radius; the half-line network here is infinite). The sum b < m and sum b > m halves are folklore (CLM-C02-03)."
    change_reason: Second independent proof (Skeptic, Appendix A) checked by the Director 2026-10-18; Theorem 3 skeptic-reviewed

journal:
  - key: C02-01
    agent: Mathematical Inventor
    kind: hypothesis
    text: Proposed exchange systems - tokens on levels with local exchange rules - as a route from System A to positional numeration without assuming place value. H-C02-0 (binary carrying) and H-C02-F (Fibonacci exchanges).
    refs: [EXP-C02-01, EXP-C02-02]
  - key: C02-02
    agent: Mathematical Explorer
    kind: result
    text: Both confirmed on exhaustive derivation graphs. The Fibonacci system is not abelian - derivation lengths range from n - z(n) to roughly twice that.
    refs: [EXP-C02-01, EXP-C02-02]
  - key: C02-03
    agent: Mathematical Explorer
    kind: surprise
    text: The rule 2[k] -> [k+1]+[k+2] (sum b = m) does not terminate from 6 tokens - a pattern (2,1) glides upward forever. Initially mistaken for a bug.
    refs: [EXP-C02-03]
  - key: C02-04
    agent: Formal Verifier
    kind: infrastructure
    text: First survey run flagged 74 'violations' of H-C02-1 because only periodic gliders counted as certificates. Added the monotone-pumping certificate (a later window dominating an earlier one with an entry >= m); all 158 non-terminating rules are now certified.
    refs: [EXP-C02-03]
  - key: C02-05
    agent: Mathematical Explorer
    kind: pattern
    text: For every sum-b-equals-m rule the glider is exactly the tail-sum window T = (sum_{j>=i} b_j), i.e. every level fires exactly once - the uniform-firing steady state.
    refs: [EXP-C02-03, CLM-C02-04]
  - key: C02-06
    agent: Mathematical Inventor
    kind: hypothesis
    text: Proposed H-C02-4 - every terminating rule represents each integer uniquely.
    refs: [CLM-C02-06]
  - key: C02-07
    agent: Mathematical Skeptic
    kind: rejection
    text: H-C02-4 refuted by 4[k] -> 2[k+1] (base 2 with digits 0..3) and three relatives. All failures have a non-primitive reduced carry polynomial or ask for uniqueness off the reachable lattice. Proposed H-C02-4'.
    refs: [EXP-C02-04, CLM-C02-06]
  - key: C02-08
    agent: Formal Verifier
    kind: proof
    text: Proved and Lean-verified the uniqueness core (digits_unique) - Bezout over Q at the common root, Gauss's lemma, and a trailing-coefficient bound. EXP-C02-05 confirms H-C02-4' with 0 violations.
    refs: [CLM-C02-07, EXP-C02-05, proofs/lean/Infinity/C02_Exchange.lean]
  - key: C02-09
    agent: Formal Verifier
    kind: infrastructure
    text: Lesson - a first implementation of EXP-C02-04 called sympy inside a 200k-iteration loop and timed out; replaced by exact integer matrices (x^k mod the minimal polynomial, scaled by a common denominator). Also, a pkill pattern matched its own shell; use patterns that cannot match the issuing command line.
    refs: [EXP-C02-04]
  - key: C02-10
    agent: Historian and Novelty Analyst
    kind: novelty
    text: The Fibonacci exchange system is the Zeckendorf game (Baird-Smith, Epstein, Flint, Miller 2018); our shortest-derivation theorem is theirs and A219641. Rule p -> q is the rational base system of Akiyama-Frougny-Sakarovitch (A024629). The OEIS hit A089881 (twin primes) for representation lengths is a coincidence on a shifted window - matches must be read, not just counted.
    refs: [EXP-C02-06, CLM-C02-09]
  - key: C02-11
    agent: Mathematical Skeptic
    kind: review
    text: Open caution - the uniqueness theorem's novelty is doubtful (canonical number system literature); keep NOT ASSESSED until the Historian audit. The B = m conjecture still lacks the spreading lemma.
    refs: [CLM-C02-07, CLM-C02-04]
  - key: C02-12
    agent: Historian and Novelty Analyst
    kind: novelty
    text: Independent audit (reviews/historian_C01_C02.md) - uniqueness (CLM-C02-07) and radix order (CLM-C02-08) are Akiyama-Frougny-Sakarovitch 2008 Lemma 5 and Prop. 11 transplanted; the termination dichotomy is folklore; our longest-Zeckendorf-game table is already in Baird-Smith et al. Fig. 4. Only the sum-b = m glider (CLM-C02-04, with the 28 certificates of CLM-C02-05) has no known equivalent; Propp (2017) proposed the rule family without results.
    refs: [CLM-C02-03, CLM-C02-04, CLM-C02-07, CLM-C02-08, CLM-C02-10]
  - key: C02-13
    agent: Research Director
    kind: revision
    text: Labels revised per the audit; README note added that AFS normalise rational-base expansions differently (their expansion of N is our chip representation of qN, e.g. AFS 3 -> 210, A024629 6 -> 210).
    refs: [CLM-C02-07, CLM-C02-08]
  - key: C02-14
    agent: Research Director
    kind: proof
    text: Proved the critical-rule conjecture (CLM-C02-04) - the sweep window map is A x - phi(x) b with A having eigenvalues 1/mu for the roots of sum b_j mu^j = m; for gcd-1 support all non-unit eigenvalues lie inside the unit disk, so after O(log n) levels the window is a large multiple of T plus a bounded error and dominates T. Completes the termination classification of carry rules (CLM-C02-11).
    refs: [CLM-C02-04, CLM-C02-11, proofs/paper/C02.md]
  - key: C02-15
    agent: Formal Verifier
    kind: result
    text: EXP-C02-07 tested the sharper prediction (non-termination from EVERY large start) on 98 critical rules - no spectral exception and every start beyond <= 124 certified.
    refs: [EXP-C02-07]

  - key: C02-16
    agent: Mathematical Skeptic
    kind: review
    text: Independent review of all C02 claims (reviews/skeptic_C01_C02.md) - nothing refuted; CLM-C02-07 restricted (converse false for 2[k] -> 4[k+1], existence false for 2[k] -> 3[k+1] when sum b > m); a gap in the radix-order proof (CLM-C02-08) closed; a second, Perron-Frobenius proof of the critical-rule theorem supplied (Appendix A) and simulated on 668,793 aperiodic critical rules.
    refs: [CLM-C02-07, CLM-C02-08, CLM-C02-04, CLM-C02-11, reviews/skeptic_C01_C02.md]
  - key: C02-17
    agent: Formal Verifier
    kind: decision
    text: Checked the Skeptic's Appendix A line by line (monotone minorant F(x) >= Ax - b, primitivity from cycle lengths with gcd 1, domination of T after N steps) - correct; added as Theorem 10 of proofs/paper/C02.md. Regenerated EXP-C02-03 with the committed script (rows identical, only the stale summary text changed; provenance issue C4 of the review).
    refs: [proofs/paper/C02.md, EXP-C02-03, CLM-C02-05]

