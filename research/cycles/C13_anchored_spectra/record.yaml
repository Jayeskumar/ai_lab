claims:
  - id: CLM-C13-01
    type: theorem
    system: SYS-B
    title: Affine anchored spectra are root sets of polynomial systems - divisor-closed, CRT-closed, finite ones are divisor sets
    statement: "For any finite set E of laws, the anchored affine tables are exactly x*y = x + a*y + 1, and the affine spectrum Aff(E) is the set of N for which the affine system of E (polynomials in Z[a]) has a common root mod N. Aff(E) is closed under divisors and under coprime products; if the system has no common factor over Q it is finite and equal to the set of divisors of its maximum L (L divides every non-zero integer of the ideal generated by the system in Z[a], e.g. any non-zero constant of the system or any non-zero resultant of two of its polynomials), and otherwise it is infinite (an empty system gives Aff(E) = N)."
    verification: PROVEN
    proof_check: "Lean 4 (complete, except the standard fact quoted as an example that a resultant of two polynomials lies in the ideal they generate) - proofs/lean/Infinity/C13_AffineStructure.lean: the anchored affine tables are exactly x + a*y + 1 (affine_anchored, affine_table_anchored); a law holds in x + a*y + 1 on Z/N iff a is a common root mod N of its affine system (law_holds_affine_iff, affModels_eq); closure under divisors and coprime products (aff_of_dvd, aff_mul_of_coprime, mem_aff_iff_primePow); with no common factor over Q the spectrum is finite, equal to the divisors of its maximum L, and L divides every integer of the ideal (aff_structure_of_no_common_factor); a common factor of positive degree makes it infinite (aff_infinite - via Gauss's lemma instead of the paper's Schur argument) and the empty system gives every N (aff_empty); Theorem 1(f) as well (aff_of_root, primePow_root_iff, primePow_mem_aff_iff_of_coprime_cofactors); standard axioms only. The paper proof was skeptic-reviewed 2026-10-18 (reviews/skeptic_C13_C19.md); consistent with all 152 spectra of EXP-C13-01"
    proof: proofs/paper/C13.md#theorem-1-clm-c13-01--the-structure-of-affine-spectra
    evidence: [EXP-C13-01]
    novelty: REDISCOVERY
    novelty_basis: "Elementary consequences of the CRT and of classical facts on polynomial congruences; the reduction of identities to conditions on affine (linear) representations is standard for quasigroups and medial magmas (Toyoda-Bruck). Recorded as the lab's tool, not as new mathematics. The Equational Theories Project also studies spectra of single magma laws with linear models x * y = ax + by mod n (Bolan et al., arXiv:2512.07087; noted by the Skeptic from the abstract page)."
    lean: [proofs/lean/Infinity/C13_AffineStructure.lean]
    change_reason: "Batch 1.1 (G2) - Theorem 1 formalised in Lean (C13_AffineStructure.lean)"
  - id: CLM-C13-02
    type: theorem
    system: SYS-B
    title: "Right-normed laws (xy)z = x V(y,z) have only translation models"
    statement: For every term V(y, z) not containing x, every anchored model of (x*y)*z = x*V(y, z) is a translation table x*y = x + 1 + k(y) with k a permutation of Z/N fixing 0, and k satisfies k(V(y,z)) = k(y) + k(z) + 1.
    verification: PROVEN
    proof_check: "Lean 4 + Mathlib (translation_form, right_normed_translation - stated for an arbitrary binary function V, so more general than the English; standard axioms only); the relation k(V(y,z)) = k(y) + k(z) + 1 by the written proof (one substitution, proofs/paper/C13.md Theorem 2)"
    proof: proofs/paper/C13.md#theorem-2-clm-c13-02--right-normed-laws-have-only-translation-models
    lean: [proofs/lean/Infinity/C13_Spectra.lean]
    evidence: [EXP-C13-03]
    novelty: POTENTIALLY NOVEL
    novelty_basis: "Low confidence. Anchored magmas impose Laver's initial condition x * 0 = x + 1 on arbitrary laws. Spectra of single magma laws are studied without anchor in the Equational Theories Project (arXiv:2512.07087 section 9; B. Le Floch, 'Spectra of equational laws', 2025). No treatment of anchored models or of right-normed laws was found. Small lemma (Historian audit 2026-10-19, reviews/historian_C11_C20.md)."
    change_reason: "Historian audit 2026-10-19 - label upheld (low confidence), basis corrected"
  - id: CLM-C13-03
    type: theorem
    system: SYS-B
    title: "The W-family: anchored models of (xy)z = x(y W(z)) are the affine tables with a*c_W(a) = 1"
    statement: |
      For every one-variable term W(z), the anchored models of (x*y)*z = x*(y*W(z)) are exactly the affine tables
      x*y = x + 1 + a*y with a*c_W(a) = 1 (mod N), c_W(a) the sum over the leaves of W of a^(number of right steps);
      distinct roots give distinct models. The occurring polynomials c_W are exactly those with non-negative integer
      coefficients, constant term 1 and no gaps. In particular the right comb with n leaves gives the spectrum of the
      n-bonacci polynomial (golden law for n = 2, tribonacci law for n = 3) and the left comb with k + 1 leaves the
      condition k*a^2 + a - 1 = 0.
    verification: PROVEN
    proof_check: "Lean 4 + Mathlib for the model correspondence for every W (w_family_models, w_family_model_of_root, linear_of_shift, T1.eval_affine, T1.cpoly_eq; standard axioms only); the characterisation of the occurring c_W by written proof (proofs/paper/C13.md Theorem 3 (iv), skeptic-reviewed 2026-10-18 (reviews/skeptic_C13_C19.md); the Skeptic confirmed (iv) for all trees with up to 16 leaves); 0 mismatches on 23 terms for N <= 9 (EXP-C13-03)"
    proof: proofs/paper/C13.md#theorem-3-clm-c13-03--the-w-family-polynomial-spectra-apa--1
    lean: [proofs/lean/Infinity/C13_Spectra.lean]
    evidence: [EXP-C13-03, EXP-C13-09]
    novelty: POTENTIALLY NOVEL
    novelty_basis: "Low confidence. Reducing laws to polynomial congruences through linear models is standard (Toyoda-Bruck; the ETP uses x * y = ax + by over Z/n, arXiv:2512.07087 section 9). The anchored W-family theorem was not found: true spectrum = roots of a*c_W(a) - 1, and every gap-free c_W with constant term 1 occurs. The number theory of the resulting sets is classical (earlier searches: Klaska-Skula, Fibonacci Quart. 2010; Moree-Noubissie arXiv:2205.06685) (Historian audit 2026-10-19, reviews/historian_C11_C20.md)."
    change_reason: "Historian audit 2026-10-19 - label upheld (low confidence), basis corrected"
  - id: CLM-C13-04
    type: theorem
    system: SYS-B
    title: "Exact finite spectra {1,3} and {1,2} for x(yz) = ((zx)x)y and x(yz) = ((xy)z)x"
    statement: The law x(yz) = ((zx)x)y has anchored models exactly for N in {1, 3} (unique model x*y = x + 1 + 2y at N = 3), and x(yz) = ((xy)z)x exactly for N in {1, 2} (unique model x*y = x + 1 at N = 2).
    verification: PROVEN
    proof_check: "Lean 4 + Mathlib for N | 3 resp. N | 2 and for the existence of the models (law13_size_dvd_three, law13_model_three, law12_size_dvd_two, law12_model_two; standard axioms only); uniqueness of the models by the written proof (proofs/paper/C13.md Theorem 4), skeptic-reviewed 2026-10-18 (reviews/skeptic_C13_C19.md)"
    proof: proofs/paper/C13.md#theorem-4-clm-c13-04--two-of-the-finite-spectra-of-clm-c06-10
    lean: [proofs/lean/Infinity/C13_Spectra.lean]
    evidence: [EXP-C13-04]
    novelty: POTENTIALLY NOVEL
    novelty_basis: "Settles two cases of the lab's own conjecture CLM-C06-10; anchored spectra do not occur in the ETP material read (arXiv:2512.07087 section 9; Le Floch 2025). Small (Historian audit 2026-10-19, reviews/historian_C11_C20.md)."
    change_reason: "Historian audit 2026-10-19 - label upheld, basis refreshed"
  - id: CLM-C13-05
    type: theorem
    system: SYS-B
    title: "The law x = x(x(xx)) has anchored models of every size except 2"
    statement: The one-variable law x = x*(x*(x*x)) has an anchored model of every size N != 2 and none of size 2; in particular its spectrum contains 4 but not 2, so anchored spectra need not be closed under divisors.
    verification: PROVEN
    proof_check: Lean 4 + Mathlib (cube_law_no_two, cubeOp_model with an explicit model for every N >= 3; standard axioms only); written proof proofs/paper/C13.md Theorem 5; explicit models re-checked numerically for N = 3..60 (EXP-C13-09)
    proof: proofs/paper/C13.md#theorem-5-clm-c13-05--a-spectrum-that-is-not-closed-under-divisors
    lean: [proofs/lean/Infinity/C13_Spectra.lean]
    evidence: [EXP-C13-07, EXP-C13-09]
    novelty: NOT ASSESSED
    novelty_basis: Elementary; its interest is as the counterexample to the lab's hypothesis H-C13-1.
  - id: CLM-C13-06
    type: theorem
    system: SYS-B
    title: Offset congruence closure is a sound prover of finite anchored spectra; it settles 16 of the 17 laws of CLM-C06-10
    statement: |
      The procedure offset_closure_bound (systems/anchored.py) returns g >= 0 such that N | g for every anchored model of
      size N. If g > 0 and every divisor of g admits an affine model, the anchored spectrum is exactly Div(g). This proves
      the conjectured spectra {1,3} resp. {1,2} of CLM-C06-10 for all its laws except x(yz) = y((yx)z), and the exact
      finite spectrum Div(g) for 6,912 of the 18,581 laws over {x,y,z} with <= 4 leaves per side (6,045 of them have
      only the trivial model).
    verification: PROVEN
    proof_check: "written soundness proof (proofs/paper/C13.md Theorem 6); applications computer-assisted (Python, EXP-C13-08) - trust base is the closure code, cross-checked against SAT/affine models on 603 laws (235 with a bound, 1,245 sizes) with 0 contradictions; skeptic-reviewed 2026-10-18 (reviews/skeptic_C13_C19.md) - its independent closure proves the same 16 laws and 6,912 exact spectra, with 0 contradictions against all anchored tables at N = 2, 3 and 28,890 SAT instances at N = 4-7"
    proof: proofs/paper/C13.md#theorem-6-clm-c13-06--soundness-of-offset-congruence-closure
    evidence: [EXP-C13-08, EXP-C13-04]
    novelty: NOT ASSESSED
    novelty_basis: Congruence closure with integer offsets is a standard decision-procedure idea (difference/offset equalities, Nelson-Oppen style); its use as a spectrum prover for anchored magmas is the lab's.
    change_reason: "Skeptic review 2026-10-18 - soundness proof upheld, code matches"
  - id: CLM-C13-07
    type: hypothesis
    system: SYS-B
    title: "H-C13-1: every anchored spectrum is closed under divisors (refuted)"
    statement: If a set of laws has an anchored model of size N, it has one of every size d dividing N.
    verification: REFUTED
    counterexample: "x = x(x(xx)) has models of every size except 2 (CLM-C13-05, Lean). Violations are common - 24 of 253 one-variable laws (N <= 12), 81 of 300 random 2-variable laws (N <= 9), 29 of 150 random 3-variable laws and 17 of 80 random pairs of laws (N <= 8); e.g. ((xy)x)y = (y(xx))x has models at N = 6 and 8 but none at N = 2, 3, 4, 5."
    evidence: [EXP-C13-05, EXP-C13-06, EXP-C13-07]
    novelty: NOT ASSESSED
  - id: CLM-C13-08
    type: hypothesis
    system: SYS-B
    title: "H-C13-2: laws with an infinite non-trivial affine spectrum are affinely rigid (refuted)"
    statement: For every law with at most 4 leaves per side (3 variables) or 5 leaves per side (2 variables) whose affine spectrum is infinite and not all N, every anchored model is affine.
    verification: REFUTED
    counterexample: "146 of the 147 laws tested from infinite non-trivial affine classes have non-affine models (EXP-C13-02, corrected run), all at every N = 6, 7, 8; e.g. x = x(x(xx)) (affine spectrum A034017, non-affine models for N = 3..8) and (xx)x = (yy)y (non-affine models for N = 2..8). (The first run also tested 52 laws from finite classes Div(L), L >= 61, through a faulty filter - they are all non-rigid too.)"
    evidence: [EXP-C13-02]
    novelty: NOT ASSESSED
    change_reason: "Skeptic review 2026-10-18 (C1) - EXP-C13-02 re-run with the correct class selection"
  - id: CLM-C13-09
    type: hypothesis
    system: SYS-B
    title: "H-C13-5: a one-variable law has spectrum {1} or a cofinite spectrum (refuted)"
    statement: Every law t1(x) = t2(x) in one variable has anchored spectrum {1} or contains all sufficiently large N.
    verification: REFUTED
    counterexample: "x = (xx)x has spectrum exactly {1, 2}: at x = 0 the anchor gives 0 = 2, and x*y = x + 1 is a model of size 2; likewise x = ((xx)x)x has spectrum {1, 3} and x = (((xx)x)x)x has {1, 2, 4} (proofs/paper/C13.md, remark after Theorem 5)."
    evidence: [EXP-C13-07]
    novelty: NOT ASSESSED
  - id: CLM-C13-10
    type: conjecture
    system: SYS-B
    title: Spectra of one-variable laws are finite or cofinite
    statement: Every one-variable law t1(x) = t2(x) has an anchored spectrum that is either finite or contains all sufficiently large N.
    verification: COMPUTATIONALLY SUPPORTED
    evidence: [EXP-C13-07]
    novelty: NOT ASSESSED
    limitations: "Supported by the 253 laws with <= 5 leaves per side and N <= 12 - every observed spectrum is {1}, Div(2), Div(3), Div(4), or all N up to 12 except at most {2}, {3} or {2,3}. The Skeptic extended the check to all 2,080 one-variable laws with <= 6 leaves (N <= 12) - spectra {1}, all N, Div(2), Div(3), Div(4), Div(5), or all N except {2}, {3}, {2,3}, {2,4}, {4} or {2,3,4}; nothing neither finite nor cofinite."
    change_reason: "Skeptic review 2026-10-18 - evidence extended to 6 leaves"
  - id: CLM-C13-11
    type: theorem
    system: SYS-B
    title: Single laws whose affine spectra are classical arithmetic sets
    statement: "The affine anchored spectrum of a law contains {N : G has a root mod N}, G the primitive Q-gcd of its affine system, with equality at every prime not dividing a non-zero integer of the ideal generated by the cofactors f/G (Theorem 1 (f)); for the eleven polynomials below the two sets coincide for every N, because each is realised by a law whose system contains G itself (e.g. x(xx) = y(xy) has system {a^2 + 1}, (xx)(xy) = (yy)(yx) has {a^2 - 2a - 1}, ((xx)x)x = x((xx)(xx)) has {a^2 + 2a - 2, a^3 + 2a^2 - 2a}). Among laws with at most 4 leaves (3 variables) or 5 leaves (2 variables) this realises - via the polynomials 2a + 1, 3a + 1, a^2 + 1, a^2 - 2a - 1, a^2 + 2a - 2, a^2 + a + 1, a^2 - a - 1, 2a^2 + 2a + 1, 2a^2 - 1, a^4 + 1, a^4 - a^2 + 1 - the odd numbers, the numbers prime to 3, and the numbers N modulo which -1, 2, 3 are squares, x^2 + x + 1 has a root, the golden ratio exists, all prime factors are 1 mod 4, +-1 mod 8 or 1 mod 12, and -1 is a fourth power."
    verification: PROVEN
    proof_check: "affine systems computed mechanically (EXP-C13-01) and Theorem 1 (written); the identification of each root set with the stated arithmetic condition is elementary (e.g. a^2 - 2a - 1 = 0 iff (a - 1)^2 = 2); terms <= 200 agree with the OEIS entries A005408, A001651, A008784, A057126, A057125, A034017, A089270, A004613, A058529, A192453, A354467; Theorem 1 (f) added after the Skeptic's review (the first statement cited exceptional primes that Theorem 1 did not contain); skeptic-reviewed 2026-10-18 (reviews/skeptic_C13_C19.md) - all 11 identifications equal the arithmetic definitions for every N <= 2000"
    proof: proofs/paper/C13.md#theorem-1-clm-c13-01--the-structure-of-affine-spectra
    evidence: [EXP-C13-01, EXP-C13-09]
    novelty: POTENTIALLY NOVEL
    novelty_basis: "Low confidence. Classical arithmetic sets occur as (unanchored) spectra of single laws in the Equational Theories Project (e.g. law 546: sums of two squares; Le Floch's notes section 2.1). Their realisation as affine anchored spectra was not found. The sets themselves are classical (OEIS entries quoted). These are affine spectra only - by EXP-C13-02 the true spectra of the short laws realising them are usually larger (Historian audit 2026-10-19, reviews/historian_C11_C20.md)."
    change_reason: "Historian audit 2026-10-19 - label upheld (low confidence), basis corrected"
  - id: CLM-C13-12
    type: observation
    system: SYS-B
    title: Non-affine models typically exist for all sizes beyond a small threshold; no Laver-like sparse spectrum found
    statement: "All 146 non-rigid laws from infinite affine classes in EXP-C13-02 have non-affine anchored models at every N = 6, 7, 8; no law other than left-distributivity was found whose non-affine models occur only at sparse sizes such as powers of two."
    verification: COMPUTATIONALLY SUPPORTED
    evidence: [EXP-C13-02, EXP-C13-05, EXP-C13-06]
    novelty: NOT ASSESSED
    limitations: Sizes N <= 8-9 only; a sparse infinite spectrum cannot be recognised from so few sizes. Question 3 of the cycle remains open.
    change_reason: "Skeptic review 2026-10-18 (C1) - counts corrected after the re-run of EXP-C13-02 (the first run's 198 laws included 52 from finite classes)"

