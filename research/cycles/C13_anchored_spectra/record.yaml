experiments:
  - id: EXP-C13-01
    analysis: "Affine atlas. The 18,581 laws over {x,y,z} with <= 4 leaves per side fall into 2,400 affine systems and 27 distinct affine spectra; the 75,625 laws over {x,y} with <= 5 leaves per side into 3,631 systems and 125 spectra. Every finite affine spectrum is a divisor set Div(L) (80 values of L up to 328). The infinite ones are classical number-theoretic sets, identified by OEIS - odd numbers (A005408), 3 does not divide N (A001651), -1 is a square (A008784), 2 is a square (A057126), 3 is a square (A057125), x^2+xy+y^2 (A034017), golden (A089270), prime factors 1 mod 4 (A004613), prime factors +-1 mod 8 (A058529), -1 a fourth power (A192453), prime factors 1 mod 12 (A354467), forms of discriminant -7, -11, 13 (A244779, A244780, A243656) and -8-type (A225771); 29 conditions - 25 cubic or quartic (plastic number x^3 - x - 1, tribonacci, tetranacci, 5th cyclotomic polynomial, ...) and the quadratics 2a^2 - 2a - 1, 2a^2 + a - 2, 3a^2 + 1, 3a^2 - 1 - give sequences with no OEIS match."
    verification: PROVEN
    related: [CLM-C13-01, CLM-C13-11]
  - id: EXP-C13-02
    analysis: "Rigidity test - the 3 shortest laws of every infinite non-trivial affine class (147 laws from the 56 classes, selected by the Q-gcd of the affine system), all affine tables blocked, N = 2..8. 146 laws have non-affine anchored models, all at every N = 6, 7, 8; only x((yz)z) = z((yx)x) (affine system 2a^2 - 1) is rigid on the tested range; 0 UNKNOWN instances. H-C13-2 refuted. (Corrected after the Skeptic's review - the first run selected classes by a spectrum heuristic that also let in 52 laws from 23 finite classes Div(L), L >= 61, and reported 198 of 199 non-rigid with 12 UNKNOWN instances, all of them in finite-class laws.) The short laws of each class are weak (e.g. x = x(x(xx)) constrains only diagonals). A first run with 4 laws per class, N <= 9 and budget 2,000,000 was stopped after 17 CPU-minutes."
    verification: REFUTED
    counterexamples: ["x = x(x(xx)): affine spectrum A034017 (1, 3, 7, 13, ...) but non-affine anchored models for N = 3..8"]
    related: [CLM-C13-08]
  - id: EXP-C13-03
    analysis: "Theorem 3 (W-family) tested before it was proved - for all 23 one-variable terms W with <= 5 leaves and N = 1..9, the anchored models of (xy)z = x(y W(z)) are exactly the affine tables with a*c_W(a) = 1: 0 mismatches. 16 distinct polynomials c_W occur; the golden law gives A089270, c_W = 1 + 3a gives A243656, c_W = 1 + a + 2a^2 gives the odd numbers, and the tribonacci and tetranacci laws give spectra not in the OEIS."
