cycle: C10
title: The cost of counting across representations
branch: C
status: complete
systems: [SYS-C]

experiments:
  - id: EXP-C10-01
    analysis: All classical constants confirmed to 5-6 digits; Zeckendorf averages 2 like binary; skew binary has worst case 2.
    related: [CLM-C10-01, CLM-C10-03, CLM-C10-07]
  - id: EXP-C10-02
    analysis: The block recurrence matches brute force; D_m = ceil(m/2) + 2 exactly.
    related: [CLM-C10-02]
  - id: EXP-C10-03
    analysis: Average firings match 1/(m - B) for all 31 rules; single-offset rules cost exactly firings + 1; multi-offset rules carry an extra rule-dependent cost.
    related: [CLM-C10-04, CLM-C10-05, CLM-C10-06]
  - id: EXP-C10-04
    analysis: T_m is OEIS A215005; the per-step Zeckendorf cost sequence is not catalogued.
    related: [CLM-C10-02]

claims:
  - id: CLM-C10-01
    type: theorem
    system: SYS-C
    title: Average cost of counting in classical representations (b/(b-1), e-1, 1)
    statement: |
      The average number of digit changes per increment is b/(b-1) in base b, 2 in negabinary, 3/2 in balanced
      ternary, e - 1 in the factorial base and exactly 1 in the binary-reflected Gray code.
    verification: PROVEN
    proof_check: written proof (proofs/paper/C10.md Theorem 1); confirmed to 6 digits for n < 1e6
    proof: proofs/paper/C10.md#theorem-1-clm-c10-01--classical-constants
    evidence: [EXP-C10-01]
    novelty: REDISCOVERY
    novelty_basis: "Classical (Cormen et al., ch. 17); see V. Berthe, C. Frougny, M. Rigo, J. Sakarovitch, On the cost and complexity of the successor function, Adv. Appl. Math. 2020 (BFRS) (Historian audit 2026-10-18, reviews/historian_C03_C10.md)."
    notes: "Cost measure here: the number of digit positions that change between the representations of n and n+1 (Hamming distance). BFRS use carry propagation, under which the Zeckendorf value is phi^2 instead of 2."
    change_reason: "Historian audit 2026-10-18 (reviews/historian_C03_C10.md)"
  - id: CLM-C10-02
    type: theorem
    system: SYS-C
    title: "Zeckendorf counting: T_m = 2 G_m - ceil(m/2) - 2, average cost 2"
    statement: |
      The total number of digit changes when counting from 0 to G_m - 1 in the Zeckendorf system (G = 1,2,3,5,...)
      is T_m = 2 G_m - ceil(m/2) - 2, satisfying T_(m+1) = T_m + T_(m-1) + ceil(m/2) + 1; the average cost of
      Zeckendorf counting tends to 2.
    verification: PROVEN
    proof_check: written proof (proofs/paper/C10.md Theorem 2); recurrence equals brute force for m <= 24
    proof: proofs/paper/C10.md#theorem-2-clm-c10-02--zeckendorf-counting
    evidence: [EXP-C10-02, EXP-C10-04]
    novelty: "REDISCOVERY"
    novelty_basis: "In substance - the closed form of T_m is OEIS A215005 (Kotesovec); potential method; see BFRS 2020 for the carry-propagation measure (Historian audit 2026-10-18, reviews/historian_C03_C10.md)."
    notes: "Cost measure: Hamming distance between consecutive representations (not BFRS's carry propagation)."
    change_reason: "Historian audit 2026-10-18 (reviews/historian_C03_C10.md)"
  - id: CLM-C10-03
    type: hypothesis
    system: SYS-C
    title: "H-C10-0: Zeckendorf counting is cheaper than binary counting (refuted)"
    statement: The average number of digit changes per increment in the Zeckendorf system is smaller than in binary.
    verification: REFUTED
    counterexample: "Both averages tend to exactly 2 (Theorem 2 and the binary case of Theorem 1); at n < 1e6 the Zeckendorf average is 1.999992 vs binary 1.999988."
    evidence: [EXP-C10-01, EXP-C10-02]
    novelty: "REDISCOVERY"
    novelty_basis: "As CLM-C10-02; BFRS obtain phi^2 with their measure (Historian audit 2026-10-18, reviews/historian_C03_C10.md)."
    change_reason: "Historian audit 2026-10-18 (reviews/historian_C03_C10.md)"
  - id: CLM-C10-04
    type: theorem
    system: SYS-C
    title: Exchange systems fire 1/(m - sum b) times per increment on average
    statement: For every terminating carry rule (m; b) the average number of firings per increment tends to 1/(m - sum_j b_j).
    verification: PROVEN
    proof_check: "written proof (proofs/paper/C10.md Theorem 3) from the abelian property (CLM-C02-02), skeptic-reviewed 2026-10-18 (reviews/skeptic_C05_C08_C12.md); deviation <= 5.7e-4 at n = 2e5 for all 31 rules (the Skeptic - 3.4e-4 at n = 4e5)"
    proof: proofs/paper/C10.md#theorem-3-clm-c10-04--firings-in-exchange-systems
    evidence: [EXP-C10-03]
    novelty: "REDISCOVERY"
    novelty_basis: "In substance - token conservation; b-ary counter (Historian audit 2026-10-18, reviews/historian_C03_C10.md)."
    change_reason: "Skeptic review 2026-10-18 (reviews/skeptic_C05_C08_C12.md) - written proof upheld"
  - id: CLM-C10-05
    type: theorem
    system: SYS-C
    title: Single-offset exchange rules cost exactly firings + 1 per increment (average 1 + 1/(m - q))
    statement: If the carry rule has a single nonzero b_g = q < m, every increment changes exactly (number of firings) + 1 digits; the average cost is 1 + 1/(m - q).
    verification: PROVEN
    proof_check: "written proof (proofs/paper/C10.md Theorem 4), skeptic-reviewed 2026-10-18 (reviews/skeptic_C05_C08_C12.md); EXP-C10-03 summarised only the 5 rules with offset g = 1 (deviation <= 2.7e-4); the Skeptic checked all 18 single-offset rules increment by increment - every one of 400,000 increments costs exactly firings + 1"
    proof: proofs/paper/C10.md#theorem-4-clm-c10-05--single-offset-rules
    evidence: [EXP-C10-03]
    novelty: "REDISCOVERY"
    novelty_basis: "Partial - BFRS 2020 Thm 3.23 (p/(p-q), Akiyama-Frougny-Sakarovitch normalisation) (Historian audit 2026-10-18, reviews/historian_C03_C10.md)."
    change_reason: "Skeptic review 2026-10-18 (P7) - proof upheld; the evidence summary covered only the offset-1 rules"
  - id: CLM-C10-06
    type: conjecture
    system: SYS-C
    title: Multi-offset exchange rules have rule-specific average counting costs
    statement: |
      For carry rules with two or more nonzero b_j, the average digit-change cost per increment converges to a
      constant exceeding 1 + 1/(m - B) (measured excess: 0.500 for 3->(1,1), 0.333 for 4->(1,1), 0.643 for
      3->(0,1,1), 0.714 for 3->(1,0,1), 0.831 for 4->(1,1,1)), equal to an expectation under the invariant measure of
      the digit process.
    verification: COMPUTATIONALLY SUPPORTED
    evidence: [EXP-C10-03]
    novelty: "POTENTIALLY NOVEL"
    limitations: Averages over 2e5 increments only; no formula.
    novelty_basis: "As a conjecture, low confidence; BFRS section 5 (ergodic method) is the natural tool (Historian audit 2026-10-18, reviews/historian_C03_C10.md)."
    change_reason: "Historian audit 2026-10-18 (reviews/historian_C03_C10.md)"
  - id: CLM-C10-07
    type: observation
    system: SYS-C
    title: Skew binary counting has worst-case cost 2 and average 3/2
    statement: In canonical skew binary every increment changes at most 2 digits, and the average number of changed digits over the increments n -> n + 1, n < N, is 3/2 + O(log N / N).
    verification: PROVEN
    proof_check: "written proof (proofs/paper/C10.md Theorem 6 - cost = 1 + [the representation contains a 2]; the 0/1 words of that indicator satisfy B_(k+1) = B_k B_k 1); the argument was sketched by the Skeptic in its review and written out by the Director, so it was checked by two parties; uniqueness of canonical skew-binary representations is cited (Myers 1983, Okasaki 1998); measured average 1.4999955 below 1e6 (EXP-C10-01)"
    proof: "proofs/paper/C10.md#theorem-6-clm-c10-07--skew-binary-counting"
    evidence: [EXP-C10-01]
    change_reason: "Skeptic review 2026-10-18 (reviews/skeptic_C05_C08_C12.md) - an elementary proof exists; statement made precise"

    novelty: REDISCOVERY
    novelty_basis: Myers (1983), Okasaki (skew binary random-access lists).

journal:
  - key: C10-01
    agent: Mathematical Inventor
    kind: hypothesis
    text: Bold guess H-C10-0 - the sparse Zeckendorf system should count more cheaply than binary.
    refs: [CLM-C10-03]
  - key: C10-02
    agent: Mathematical Explorer
    kind: surprise
    text: Zeckendorf averages 1.999992 per increment - indistinguishable from binary. Derived the block recurrence T_(m+1) = T_m + T_(m-1) + ceil(m/2) + 1 and the closed form 2G_m - ceil(m/2) - 2; H-C10-0 refuted.
    refs: [EXP-C10-01, EXP-C10-02, CLM-C10-02]
  - key: C10-03
    agent: Formal Verifier
    kind: proof
    text: Proved that exchange systems fire 1/(m - B) times per increment (abelian property + token count) and that single-offset rules cost exactly firings + 1 (each level fires at most once per increment).
    refs: [CLM-C10-04, CLM-C10-05]
  - key: C10-04
    agent: Mathematical Explorer
    kind: pattern
    text: Multi-offset rules break firings + 1 - a level can receive several tokens per increment; excess costs between 0.30 and 0.83 recorded, some near simple fractions (1/2, 1/3, 5/7?) but no formula found.
    refs: [EXP-C10-03, CLM-C10-06]
  - key: C10-05
    agent: Application Researcher
    kind: result
    text: Negative result - no invented exchange representation beats Gray code (cost 1) or skew binary (worst case 2) as a counter; recorded honestly.
    refs: [EXP-C10-01, EXP-C10-03]
  - key: C10-06
    agent: Historian and Novelty Analyst
    kind: novelty
    text: Zeckendorf block totals are OEIS A215005; classical constants are folklore; skew binary is Myers/Okasaki.
    refs: [EXP-C10-04]

  - key: C10-07
    agent: Historian
    kind: novelty
    text: "Audit - missed source: Berthe-Frougny-Rigo-Sakarovitch (Adv. Appl. Math. 2020) on the cost of the successor; under their carry-propagation measure Zeckendorf costs phi^2, under the lab's Hamming measure 2. Claims now state the measure; T_m is OEIS A215005."
    refs: [CLM-C10-01, CLM-C10-02, CLM-C10-05, reviews/historian_C03_C10.md]

