  - key: C06-05
    agent: Formal Verifier
    kind: proof
    text: "Hand analysis of the restricted laws - substituting z = 0 in (xy)z = x((yz)z) gives x*(y+2) = x*y + 1, forcing odd N and x*y = x + 1 + y/2; in (xy)z = x(y(zz)) it gives x*(y*1) = x*y + 1, which forces x*y = x + 1 + kappa(y) and then kappa linear with a^2 + a = 1 - a golden-ratio spectrum. Both now proved (odd law also in Lean)."
    refs: [CLM-C06-06, CLM-C06-07, proofs/paper/C06.md]
  - key: C06-06
