cycle: C20
title: "Open problems revisited: the last one-rule systems of C04, and a literature check for C03"
branch: A
status: complete
systems: [SYS-A]

experiments:
  - id: EXP-C20-01
    analysis: "All 8 rules of the two classes aab -> ababa and aab -> babaa terminate on every word of length <= 12 (rightmost and leftmost strategies agree on every word, and agree with the exact maximal derivation length on all words of length <= 8, as random descent predicts). D(n) for aab -> ababa is 0, 0, 1, 3, 7, ..., 1023 = 2^(n-2) - 1; for aab -> babaa 0, 0, 1, 2, 3, 6, 9, 14, 21, 30, 45, 62 = max_b b(2^floor((n-b)/2) - 1); the per-word formula for aab -> babaa matches every word of length <= 12."
    verification: PROVEN
    related: [CLM-C20-01, CLM-C20-02, CLM-C20-03]

claims:
  - id: CLM-C20-01
    type: theorem
    system: SYS-A
    title: "aab -> ababa terminates, with derivational complexity D(n) = 2^(n-2) - 1"
    statement: The one-rule system aab -> ababa over {a, b} (and its images under reversal and letter exchange) terminates, and the maximal derivation length from words of length n >= 2 is exactly 2^(n-2) - 1, attained by a^(n-1) b.
    verification: PROVEN
    proof_check: "written proof (proofs/paper/C20.md Theorem 1 - run encoding, journeys of surplus a's under the rightmost strategy, doubling bound, random descent from the Lean-verified C04 theorem unbordered_random_descent), skeptic-reviewed 2026-10-18 (reviews/skeptic_C07_C17_C20.md); verified on all words of length <= 12 (EXP-C20-01); the Skeptic - exhaustive derivation graphs for n <= 10 and three strategies on all words of length <= 18"
    proof: proofs/paper/C20.md#theorem-1-clm-c20-01--aab--ababa-terminates-and-dn--2n2--1-n--2
    evidence: [EXP-C20-01]
    novelty: REDISCOVERY
    novelty_basis: "Termination is a rediscovery - the rule is right barren in McNaughton's sense (OVL(r,l) = {a}, r_alpha = abab; OVL(l,r) = {ab}, l_beta = a, never a suffix of (abab)^k), and every non-overlapping left/right barren one-rule system terminates (R. McNaughton, RPI tech. reports 94-18 and 95-15; A. Geser, ICASE Report 2002-33, Thm 3.2/3.3, https://ntrs.nasa.gov/api/citations/20020088729/downloads/20020088729.pdf). The exact complexity 2^(n-2) - 1 was not found in the sources read (the report proves linear lengths only for its non-barren case)."
    change_reason: "Skeptic review 2026-10-18 (reviews/skeptic_C07_C17_C20.md) - written proof upheld"
  - id: CLM-C20-02
    type: theorem
    system: SYS-A
    title: "aab -> babaa terminates; exact per-word derivation length and D(n) = max_b b(2^floor((n-b)/2) - 1)"
    statement: |
      The one-rule system aab -> babaa (and its symmetric images) terminates. For w = a^(x_0) b a^(x_1) b ... b a^(x_m),
      every maximal derivation has length sum_{k=m-1..0} d_k (2^floor(x_k/2) - 1) with d_k = (m - k) + (steps
      contributed by the runs right of k); the derivational complexity is D(n) = max_{1<=b<=n} b(2^floor((n-b)/2) - 1),
      attained by a^(n-b) b^b; explicitly D(n) = 2^(n/2) - 2 for even n >= 2 and 3*2^((n-3)/2) - 3 for odd n >= 5.
    verification: PROVEN
    proof_check: "written proof (proofs/paper/C20.md Theorem 2 - a pair of a's travels to the last run in d steps, doubling d; random descent), skeptic-reviewed 2026-10-18 (reviews/skeptic_C07_C17_C20.md); per-word formula and D(n) verified on all words of length <= 12 (EXP-C20-01); the Skeptic - exhaustive graphs for n <= 15, its own implementation of the per-word formula on all words of length <= 21"
    proof: proofs/paper/C20.md#theorem-2-clm-c20-02--aab--babaa-terminates-an-exact-formula-for-dw
    evidence: [EXP-C20-01]
    novelty: POTENTIALLY NOVEL
    novelty_basis: "Low confidence. Termination is a rediscovery (right barren: McNaughton; Geser, ICASE 2002-33). The exact derivation length D(w) and D(n) were not found. The most relevant paper was not obtained: aab is unbordered, so aab -> babaa is a confluent one-rule system, the class of Kobayashi-Katsura-Shikishima-Tsuji, 'Termination and derivational complexity of confluent one-rule string-rewriting systems', TCS 262 (2001) (ScienceDirect blocked). Geser-Hofbauer-Waldmann's derivational complexities of one-rule leftmost rewriting (JSC 38, 2004) are also unread. Small (Historian audit 2026-10-19, reviews/historian_C11_C20.md)."
    change_reason: "Historian audit 2026-10-19 - label upheld (low confidence: the decisive paper could not be read)"
  - id: CLM-C20-03
    type: theorem
    system: SYS-A
    title: The C04 extended termination census is complete - 480 of the 868 rules with |l| <= 3, |r| <= 5 terminate
    statement: Of the 868 one-rule systems l -> r over {a, b} with 1 <= |l| <= 3, |r| <= 5 (EXP-C04-02), exactly 480 terminate and 388 do not.
    verification: PROVEN
    proof_check: computer-assisted certificates for 860 rules (EXP-C04-02, CLM-C04-01/02 methods) plus Theorems 1-2 of proofs/paper/C20.md and the symmetry argument for the 8 remaining rules
    proof: proofs/paper/C20.md#corollary-3-clm-c20-03--the-c04-census-is-complete
    evidence: [EXP-C04-02, EXP-C20-01]
    novelty: NOT ASSESSED
    novelty_basis: A census; one-rule termination for small rules is classical territory (Kurth 1990; McNaughton; Geser).
  - id: CLM-C20-04
    type: observation
    system: SYS-A
    title: "C03 Conjecture 4.6 coincides with the Zantema-Geser characterisation"
    statement: "The lab's Conjecture 4.6 (CLM-C03-10) on termination of 0^p 1^q -> 1^r 0^s is equivalent to Zantema-Geser Theorem 1.1 (terminating iff p >= s, or q >= r, or p < s < 2p and q does not divide r, or q < r < 2q and p does not divide s); hence it is a published theorem. (Equivalent, not verbatim - Theorem 1.1 characterises termination and the conjecture non-termination; the conjecture's cases are exactly the non-terminating cases listed on p. 2 of the report.)"
    verification: "PROVEN"
    evidence: [EXP-C03-01]
    novelty: "REDISCOVERY"
    limitations: "The lab relies on the published proof."
    proof_check: "Theorem statement read verbatim by the Historian from the scanned tech. report UU-CS-1994-44 (https://ics-archive.science.uu.nl/research/techreps/repo/CS-1994/1994-44.pdf; the lab's own retrieval attempts at other hosts failed); equivalence by case analysis (s >= 2p or not, r >= 2q or not) and checked on all parameters <= 40"
    proof: "reviews/historian_C03_C10.md#20-the-zantemageser-theorem-verbatim-statement-and-comparison-priority-item"
    novelty_basis: "Zantema-Geser 1994/2000 (see CLM-C03-10)."
    change_reason: "Skeptic review 2026-10-18 (reviews/skeptic_C07_C17_C20.md, P8) - 'verbatim' corrected to 'equivalent'; equivalence re-checked on all parameters <= 50"

journal:
  - key: C20-01
    agent: Mathematical Inventor
    kind: hypothesis
    text: "Open problem from C04 - the 8 rules aab -> ababa, aab -> babaa (and images) were neither shown to loop nor certified terminating. Idea - aab is unbordered, so random descent reduces termination to ONE strategy; in the run encoding the rightmost strategy moves a single surplus a (resp. a pair) to the right until it is absorbed."
    refs: [CLM-C04-03]
  - key: C20-02
    agent: Formal Verifier
    kind: proof
    text: "Proved termination of both rules (journeys are finite, the number of journeys is bounded) and the exact complexities - a journey at most doubles the number of b's, which gives 2^(n-2) - 1 for aab -> ababa and max_b b(2^floor((n-b)/2) - 1) for aab -> babaa, both attained."
    refs: [CLM-C20-01, CLM-C20-02, proofs/paper/C20.md]
  - key: C20-03
    agent: Mathematical Explorer
    kind: result
    text: "EXP-C20-01 - no counterexample on all words of length <= 12 for all 8 rules; strategy independence holds exactly; both closed forms and the per-word formula match."
    refs: [EXP-C20-01]
  - key: C20-04
    agent: Historian
    kind: novelty
    text: "Both rules are right barren (McNaughton; Geser, ICASE 2002-33, Thm 3.2-3.3), so their termination was already known in principle - recorded as a rediscovery; the exact complexities were not found. The Zantema-Geser characterisation for C03 could not be retrieved (403/500/Cloudflare) - C03 Conjecture 4.6 stays unverified against it."
    refs: [CLM-C20-01, CLM-C20-02, CLM-C20-04]

  - key: C20-05
    agent: Historian
    kind: novelty
    text: "Revision of C20-04 - the scanned Zantema-Geser report UU-CS-1994-44 was found on ics-archive.science.uu.nl; its Theorem 1.1 is C03 Conjecture 4.6 verbatim (equivalence by case analysis, checked on all parameters <= 40). CLM-C20-04 and CLM-C03-10 are PROVEN (published proof) and REDISCOVERY."
    refs: [CLM-C20-04, CLM-C03-10, reviews/historian_C03_C10.md]

  - key: C20-06
    agent: Mathematical Skeptic
    kind: review
    text: "Independent review (reviews/skeptic_C07_C17_C20.md) - Theorems 1-2 and Corollary 3 upheld (exhaustive derivation graphs n <= 10 / 15, strategies to length 18 / 21); the Zantema-Geser statement re-read on the scan and the equivalence confirmed on all parameters <= 50. Correction to C20-05 - the conjecture is equivalent to Theorem 1.1, not verbatim (one characterises termination, the other non-termination). Warning - the introduction of Geser's ICASE report claims linear lengths for all one-overlap-pair rules, which aab -> ababa contradicts; only the body's restricted statement is correct."
    refs: [CLM-C20-01, CLM-C20-02, CLM-C20-04, reviews/skeptic_C07_C17_C20.md]

