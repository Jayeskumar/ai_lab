  - id: CLM-C05-24
    type: theorem
    system: SYS-B
    title: "Law 677 has no quasigroup model of order 12; a model of order 12 exists iff one of 51 explicit non-quasigroup case CNFs is satisfiable"
    statement: "No quasigroup of order 12 satisfies law 677, x = y(x((yx)y)): every finite model of order 12, if one exists, is not right-cancellative. Moreover 677 has a model of order 12 iff one of the 51 non-quasigroup part CNFs listed in results/EXP-C05-13.json is satisfiable; so such a model is either idempotent with a row having exactly one fixed point, or has a non-idempotent element a with the fewest fixed points whose row has at most one fixed point and moves a in a cycle of length at least 4."
    verification: PROVEN
    proof: "proofs/paper/C05.md#theorem-15-clm-c05-24--law-677-has-no-quasigroup-model-of-order-12-computer-assisted"
    proof_check: "computer-assisted - the 138 cases refuted by EXP-C05-11 and, for the other 57 cases of Lemma 8, the quasigroup parts (Latin columns and the column division clauses of Lemma 9') and 6 non-quasigroup parts refuted by EXP-C05-13, every refutation a DRAT proof from CaDiCaL 1.5.3 verified by drat-trim; the split by right cancellation is exhaustive (systems.magma_split.build, tested); awaiting independent review"
    evidence: [EXP-C05-13, EXP-C05-11]
    novelty: POTENTIALLY NOVEL
    novelty_basis: "No complete or quasigroup-only search of 677 at order 12 is reported in the sources read (reviews/historian_677_nonqg.md, Q4): anti-255 searches at order 12 never terminated (J. Hyun, Oct 30, 2025) and restricted searches covered other classes; the eq677 database has no model of order 12 and calls orders 12 and 14 open. The smallest known non-right-cancellative model has order 25 (M. Reinke, Nov 26, 2025)."
    limitations: "Order 12 itself stays open: 51 non-quasigroup CNFs were undecided after 1,000,000 conflicts each, and the hardest survived further probes (with a missing-value split and with implied 'star' clauses). A model of order 12 would be the smallest non-right-cancellative model of 677 known."
    related: [CLM-C05-20, CLM-C05-12, CLM-C05-14]

  - id: CLM-C05-25
    type: theorem
    system: SYS-B
    title: "Laws 467 and 704 have no model of order 12; their spectra up to order 13 are complete"
    statement: "No magma of order 12 satisfies 467, x = y(x(x(yy))), or 704, x = y(y((xx)y)). Hence the orders n <= 13 with a model are exactly 467 {1,5,7,8,9,11,13} and 704 {1,5,7,8,11,13}."
    verification: PROVEN
    proof: "proofs/paper/C05.md#theorem-16-clm-c05-25--laws-467-and-704-at-order-12-computer-assisted"
    proof_check: "computer-assisted - all 390 case CNFs of Lemma 8 (Latin rows, left division clauses) are UNSAT with DRAT proofs from CaDiCaL 1.5.3 verified by drat-trim (EXP-C05-14); members 11 and 13 from the linear models of EXP-C05-07; controls agree; awaiting independent review"
    evidence: [EXP-C05-14, EXP-C05-07, EXP-C05-09]
    novelty: POTENTIALLY NOVEL
    novelty_basis: "Not found in the sources read: B. Le Floch's notes give 467 'unknown spectrum containing' its Gaussian-integer orders and 704 'no 9'; B. Gunby-Mann (July 14, 2025) shows both contain every sufficiently large order, without an effective bound; order 12 is not addressed (Historian spectrum audit 2026-10-20, reviews/historian_spectra_2026.md)."
