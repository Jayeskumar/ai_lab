cycle: C05
title: Spectra of single-identity magma varieties
branch: B
status: complete
systems: [SYS-B]

experiments:
  - id: EXP-C05-01
    analysis: All 115 nontrivial two-variable identities t = x with 2-4 operations were decided for n = 1..6 except law 167 at n = 6 (UNKNOWN within budget; excluded by the Lean theorem). 61 have restricted spectra, 52 are full on 1..6, 2 admit only n = 1 there; mirror pairs always agree; 18 identities have non-quasigroup models of order <= 3.
    verification: COMPUTATIONALLY SUPPORTED
    novelty: REDISCOVERY
    related: [CLM-C05-01, CLM-C05-02, CLM-C05-03]
  - id: EXP-C05-02
    analysis: The 63 non-full identities fall into 15 spectrum patterns on n = 1..8, reproducing every spectrum fragment stated in the ETP notes for the laws concerned; 52/63 have only quasigroup models for n <= 5; the Dupont family (16 identities incl. laws 63, 115) has a single, medial model class at each of n = 3, 4, 5. The 'identical model set' grouping in this run compared non-canonical representatives and is not used (defect recorded).
    verification: COMPUTATIONALLY SUPPORTED
    related: [CLM-C05-02]
  - id: EXP-C05-03
    analysis: 15 laws with unknown spectrum in the ETP notes decided for n <= 10 except a few sizes (UNKNOWN at budget 1e6); zero disagreements with the notes. The field decided_beyond_notes compares only with the sizes in each law's own paragraph of the notes; the notes' lists of laws without models of order 2 (or 3) and their Gaussian-integer models of law 467 cover several of those sizes, so CLM-C05-07/08 and the README frontier table list only facts absent from the notes.
    related: [CLM-C05-07, CLM-C05-08, CLM-C05-09]
  - id: EXP-C05-04
    analysis: Nine models (laws 467, 677 x3, 883, 1286, 1313, 1516, 1719) were re-solved, re-verified and emitted as Lean decide-certificates; all nine check in Lean's kernel.
    verification: PROVEN
    related: [CLM-C05-07]
  - id: EXP-C05-05
    analysis: H-C05-A refuted - four identities (two mirror pairs) have models of every order 1..6 but affine models over Z_n only for n in {1,5} or {1,2,5}; 39 restricted identities also have spectrum members without affine models; no affine model was ever found outside the SAT spectrum.
    verification: REFUTED
    counterexamples: ["x = (y*x)*(x*(y*y)): NAND on {0,1} is a model, no affine operation over Z_2 is"]
    related: [CLM-C05-06]
  - id: EXP-C05-06
    analysis: All 48 UNSAT instances flagged by EXP-C05-03 were re-solved with Glucose 4 proof logging and every DRUP refutation was VERIFIED by drat-trim.
    verification: PROVEN
    related: [CLM-C05-08]

  - id: EXP-C05-07
    analysis: "After the Skeptic's refutation of CLM-C05-09 - linear models x*y = ax + by over every GF(q), q <= 128 (44 prime powers), for the 15 open laws. 0 conflicts with the SAT statuses, the DRUP-certified gaps or the ETP notes. Even orders occur for 14 of the 15 laws (none for 907); 677 and 1313 have models of order 16 (their smallest even linear order). Two sizes left UNKNOWN by EXP-C05-03 are settled - law 670 at n = 9 (not in the notes) and law 907 at n = 9 (already in the notes)."
    related: [CLM-C05-09, CLM-C05-10]

claims:
  - id: CLM-C05-01
    type: hypothesis
    system: SYS-B
    title: "H-C05-1: a single identity t = x cannot restrict the orders of its finite models (refuted)"
    statement: Every identity t = x has spectrum {1} or the set of all positive integers.
    verification: REFUTED
    counterexample: "ETP law 167, x = (y*x)*(x*y): Lean-certified models of orders 4 and 5 (T4_law167, T5_law167) and no model of order 2, 3, 6 or 7 (law167_card_mod_four: every finite model has order 0 or 1 mod 4). The census EXP-C05-01 finds 61 of 115 nontrivial two-variable identities with spectra on n <= 6 that are neither {1} nor everything."
    evidence: [EXP-C05-01]
    novelty: NOT ASSESSED
  - id: CLM-C05-02
    type: observation
    system: SYS-B
    title: Spectrum census of the 115 nontrivial two-variable identities t = x with 2-4 operations (n <= 6, restricted ones to n <= 8)
    statement: |
      Of the 115 identities t = x (x occurring in t, neither leftmost nor rightmost), 52 have models of every order
      1..6, 2 have none of orders 2..6, and 61 have restricted spectra; the 63 non-full ones fall into 15 patterns
      on n = 1..8 listed in research/cycles/C05_magma_spectra/README.md (e.g. 10111011 for 16 identities including
      the Dupont law, 10110010 = Mendelsohn pattern for law 66 and three equivalents, 1010001? for law 907).
    verification: COMPUTATIONALLY SUPPORTED
    evidence: [EXP-C05-01, EXP-C05-02]
    novelty: REDISCOVERY
    novelty_basis: "The Equational Theories Project classified all 741 classes of laws of order <= 4 and B. Le Floch's notes 'Spectrum of equational laws' (Lean Zulip upload spectrum.pdf) discuss every law with possibly non-full spectrum; our census agrees with every spectrum fragment stated there for the laws concerned."
    limitations: Non-memberships in the census are SAT-solver results (CaDiCaL) without proof certificates, except those re-certified in EXP-C05-06; one instance (law 167, n = 6) is UNKNOWN within budget.
  - id: CLM-C05-03
    type: hypothesis
    system: SYS-B
    title: "H-C05-Q: nontrivial identities t = x force their finite models to be quasigroups (refuted)"
    statement: If x occurs in t but is neither its leftmost nor its rightmost leaf, every finite model of t = x is a quasigroup.
    verification: REFUTED
    counterexample: "The 4-element model T4 of law 167, x = (y*x)*(x*y), has row 1 = (0, 2, 2, 2) (Lean: T4_law167, T4_not_latin). In the census, 18 of the 115 identities already have non-quasigroup models of order <= 3."
    evidence: [EXP-C05-01, EXP-C05-02]
    novelty: NOT ASSESSED
  - id: CLM-C05-04
    type: theorem
    system: SYS-B
    title: "Law 167, x = (y*x)*(x*y): every finite model has order 0 or 1 mod 4"
    statement: |
      If a finite magma satisfies x = (y*x)*(x*y) for all x, y, its order n satisfies n = 0 or 1 (mod 4).
      (With the constructions of the ETP write-up "Spectra of order-3 equations" the spectrum is exactly
      {n : n = 0, 1 mod 4}.)
    verification: PROVEN
    proof_check: Lean 4 + Mathlib (Infinity.C05.law167_card_mod_four; standard axioms only); models of orders 4 and 5 certified by decide
    proof: proofs/paper/C05.md#theorem-2-clm-c05-04--law-167-xyxxy-orders-are--0-1-mod-4
    lean: [proofs/lean/Infinity/C05_Magmas.lean]
    evidence: [EXP-C05-01]
    novelty: REDISCOVERY
    novelty_basis: "Proposition 3 of the ETP write-up 'Spectra of order-3 equations' (Lean Zulip upload; attributed in Le Floch's notes to Ben Gunby-Mann) gives the same orbit argument and the full spectrum. Our addition is a Lean formalisation of the necessity half via a fixed-point-free involution on Sym2."
  - id: CLM-C05-05
    type: theorem
    system: SYS-B
    title: Identities x = y*s(x, y) make every left translation of a finite model bijective
    statement: |
      If a finite magma satisfies x = y * s(x, y) for some binary term operation s, every left translation a -> y*a
      is a bijection (every row of the Cayley table is a permutation). More generally, in a finite model of t = x
      with x occurring once in t, every translation on the path from the root of t to x is a bijection.
    verification: PROVEN
    proof_check: "Lean 4 + Mathlib for the x = y*s(x,y) case (left_mul_bijective_of_law); the general path version by written proof, skeptic-reviewed 2026-10-18 (reviews/skeptic_C05_C08_C12.md, A.1)"
    proof: proofs/paper/C05.md#lemma-1-clm-c05-05--translations-along-the-path-to-a-unique-occurrence-of-x
    lean: [proofs/lean/Infinity/C05_Magmas.lean]
    evidence: [EXP-C05-03]
    novelty: REDISCOVERY
    novelty_basis: Standard finite-set argument (a surjective self-map of a finite set is bijective), used throughout the ETP notes.
    change_reason: "Skeptic review 2026-10-18 (reviews/skeptic_C05_C08_C12.md) - written part upheld"
  - id: CLM-C05-06
    type: hypothesis
    system: SYS-B
    title: "H-C05-A: full spectrum iff affine models over every Z_n (refuted)"
    statement: A nontrivial identity t = x has models of all orders 1..6 iff it has an affine model x*y = a x + b y + c over Z_n for every n <= 6.
    verification: REFUTED
    counterexample: "x = (y*x)*(x*(y*y)) has models of every order 1..6 (EXP-C05-01); of order 2 it is satisfied by NAND (Lean: nand2_law), yet no affine operation over Z_2 satisfies it (Lean: no_affine_model_mod2); its affine models exist only for n in {1, 5}. Three further identities behave alike (EXP-C05-05)."
    evidence: [EXP-C05-05, EXP-C05-01]
    novelty: NOT ASSESSED
  - id: CLM-C05-07
    type: theorem
    system: SYS-B
    title: "New spectrum memberships for open ETP laws: 677 has models of orders 5, 7, 9; 1286, 1313 and 1516 have models of order 9"
    statement: |
      Each of the following order-4 laws has a model of the stated order (explicit Cayley tables):
      677 x = y(x((yx)y)) - orders 5, 7, 9; 1286 x = y(((xy)x)y) - order 9; 1313 x = y(((yx)x)y) - order 9;
      1516 x = (yy)(x(xy)) - order 9. (A certified order-9 model of law 467, x = y(x(x(yy))), is also recorded, but
      that order is already covered by the notes' construction on Z[i]/(k+il) with k = 3, l = 0.)
    verification: PROVEN
    proof_check: Lean 4 kernel decide on explicit tables (E677_order5_law, E677_order7_law, E677_order9_law, E1286_order9_law, E1313_order9_law, E1516_order9_law; also E467_order9_law); only propext
    proof: proofs/lean/Infinity/C05_Magmas.lean (section Frontier)
    lean: [proofs/lean/Infinity/C05_Magmas.lean]
    evidence: [EXP-C05-03, EXP-C05-04]
    novelty: POTENTIALLY NOVEL
    novelty_basis: "Not stated in B. Le Floch's notes 'Spectra of equational laws' (ETP, July 10, 2025), which list 1313 and 1516 as 'starting with' 1,5,7 and 1,5,7,8, 1286 as 'starting with 1,7', and give no sizes for 677. A second reading (2026-10-18) found that the notes' Gaussian-integer models of law 467 (all odd k^2 + l^2 with k, l of different parities) include 9 = 3^2 + 0^2, so 467 is not counted (the check is written out in proofs/paper/C05.md, Remark 5). The ETP paper (arXiv:2512.07087) defers detailed spectra to a forthcoming publication and was only partly retrieved; ETP model searches may already contain these models, so novelty is only relative to the sources read."
  - id: CLM-C05-08
    type: theorem
    system: SYS-B
    title: "New spectrum gaps for open ETP laws (certified UNSAT): 501 has no models of orders 6, 7; 677 none of order 6; 883 none of 6; 1076 none of 8; 1083 none of 5, 6"
    statement: |
      No magma of the stated order satisfies the law. Not stated in Le Floch's notes: 501 x = y(y(x(xy))) - orders
      3, 6, 7; 677 x = y(x((yx)y)) - orders 3, 4, 6; 883 x = y((xy)(yy)) - order 6; 1076 x = y((x(xy))y) - order 8;
      1083 x = y((x(yx))y) - orders 5, 6. Also certified, but already stated in the notes: no model of order 2 for
      501, 677, 1083 and 1719 x = (yy)((xx)y), and none of order 3 for 883.
    verification: PROVEN
    proof_check: computer-assisted - DRUP refutations from Glucose 4 verified by drat-trim (48/48 instances of EXP-C05-06); trust base = drat-trim, the CNF generator (Lemma 0, brute-force cross-checked) and the soundness of the added constraints (Lemma 4 / Lean left_mul_bijective_of_law). Independently confirmed by the Skeptic - all 15 claimed gaps UNSAT under its own CNF encoding with Kissat 4.0.4, the 13 with n <= 6 also under CaDiCaL 1.9.5 without the extra constraints (reviews/skeptic_C05_C08_C12.md)
    proof: proofs/paper/C05.md#lemma-4--soundness-of-the-extra-sat-constraints-exp-c05-03--04--06
    evidence: [EXP-C05-03, EXP-C05-06]
    novelty: POTENTIALLY NOVEL
    novelty_basis: "Le Floch's notes list the 31 laws without a model of order 2 (including 501, 677, 1083, 1719) and the 14 with a model of order 2 but none of order 3 (including 883); otherwise they say 'containing' for 501, 883, 1083, 'unknown spectrum' for 677 and 'not 6 nor 7' for 1076. The gaps at orders 3 and 4 are small enough that ETP finite-magma searches probably settle them; the plausible additions are the gaps at n >= 5 (501: 6, 7; 677: 6; 883: 6; 1076: 8; 1083: 5, 6)."
    change_reason: "Skeptic review 2026-10-18 (reviews/skeptic_C05_C08_C12.md) - gaps independently re-derived"
  - id: CLM-C05-09
    type: conjecture
    system: SYS-B
    title: "Laws 677 and 1313 have spectrum {1} together with all odd n >= 5 (refuted - both have models of order 16)"
    statement: The finite models of x = y(x((yx)y)) (ETP 677) and of x = y(((yx)x)y) (ETP 1313) have exactly the orders 1 and the odd integers n >= 5.
    verification: REFUTED
    counterexample: "Linear models of order 16 (found by the Skeptic, reviews/skeptic_C05_C08_C12.md, Appendix B) - over GF(16) = GF(2)[t]/(t^4 + t + 1), x*y = (1 + t^3)x + t^3 y satisfies law 677 and x*y = t^3 x + (1 + t^3)y satisfies law 1313 (each has 8 such pairs (a, b)). Re-found by EXP-C05-07 and Lean-certified (E677_order16_law, E1313_order16_law, kernel decide on the 16 x 16 tables)."
    evidence: [EXP-C05-03, EXP-C05-02, EXP-C05-07]
    novelty: NOT ASSESSED
    limitations: "Supported only by n <= 10 with orders 8 and 10 undecided within budget (both laws in 5, 7, 9; out 2, 3, 4, 6); the small models are idempotent quasigroups. Weak evidence; recorded to direct the next search. The search had a blind spot - affine models were tried only over Z_n (cyclic additive group), never over GF(2^k). Whether the odd part holds, and which even orders below 16 occur (8, 10, 12, 14), is open; the Skeptic found no affine model of order 8 over any abelian group of order 8 and none over Z_10."
    change_reason: "Skeptic review 2026-10-18 (reviews/skeptic_C05_C08_C12.md) - order-16 models refute the conjecture"
  - id: CLM-C05-10
    type: theorem
    system: SYS-B
    title: "Linear models over finite fields: the orders q <= 128 at which the 15 open laws have a model x*y = ax + by over GF(q)"
    statement: "For each of the 15 open ETP laws of EXP-C05-03 the prime powers q <= 128 admitting a linear model x*y = ax + by over GF(q) are exactly those listed in results/EXP-C05-07.json. In particular laws 670, 677, 1076, 1286 and 1313 have models of order 16 (1286 also of order 32), law 670 has a model of order 9, and no law has a linear model at an order excluded by the SAT search, the DRUP certificates (CLM-C05-08) or the ETP notes."
    verification: PROVEN
    proof_check: "computer-assisted - exhaustive search over GF(q)^2 for every prime power q <= 128 (EXP-C05-07; GF(q) is unique up to isomorphism, so the absence of a linear model does not depend on the representation); every model found re-checked on its full table with the generic evaluator; three tables Lean-certified by kernel decide (E677_order16_law, E1313_order16_law, E670_order9_law)"
    proof: "proofs/paper/C05.md#theorem-6-clm-c05-10--linear-models-over-finite-fields-computer-assisted"
    evidence: [EXP-C05-07]
    novelty: NOT ASSESSED
    novelty_basis: "Linear models over finite fields are a standard tool of the Equational Theories Project; the specific orders were not compared with the project's data. The membership 670 at n = 9 is not stated in Le Floch's notes (read for C05)."
    limitations: Linear models only (no constant term, no non-abelian or non-field structures); they give spectrum members, never gaps.

journal:
  - key: C05-01
    agent: Mathematical Inventor
    kind: hypothesis
    text: Opened Branch B with the bold H-C05-1 - a single identity t = x cannot restrict the sizes of its finite models - and H-C05-Q (nontrivial identities force quasigroups).
    refs: [CLM-C05-01, CLM-C05-03]
  - key: C05-02
    agent: Formal Verifier
    kind: infrastructure
    text: Built systems/magma.py with an exact SAT encoding of identities (value variables per subterm and assignment); model counts agree with brute force on all magmas of orders 2 and 3 for four identities.
    refs: [systems/magma.py]
  - key: C05-03
    agent: Mathematical Explorer
    kind: surprise
    text: An exploratory scan showed 11 different spectrum patterns on n <= 6, including {1,3,4} (Mendelsohn-like), {1,3} (Steiner-like) and 'all but 2 and 6' (Euler's 36 officers pattern). H-C05-1 was clearly false.
    refs: [EXP-C05-01]
  - key: C05-04
    agent: Historian and Novelty Analyst
    kind: novelty
    text: Found that the Equational Theories Project already studied spectra of order <= 4 laws - the write-up 'Spectra of order-3 equations' (laws 66 Mendelsohn, 167 mod 4, 168 squares) and B. Le Floch's notes listing 48 laws with possibly non-full spectrum. The census became a rediscovery; the cycle pivoted to pushing the open cases.
    refs: [CLM-C05-02, CLM-C05-04]
  - key: C05-05
    agent: Formal Verifier
    kind: proof
    text: Lean-verified that every finite model of x = (yx)(xy) has order 0 or 1 mod 4 (pair map {a,b} -> {ab, ba} is a fixed-point-free involution on Sym2), plus certified models of orders 4 and 5.
    refs: [CLM-C05-04, proofs/lean/Infinity/C05_Magmas.lean]
  - key: C05-06
    agent: Mathematical Skeptic
    kind: rejection
    text: H-C05-Q rejected - the SAT model of law 167 of order 4 has a repeated entry in a row (Lean T4_not_latin); 18 census identities have non-quasigroup models of order <= 3.
    refs: [CLM-C05-03]
  - key: C05-07
    agent: Mathematical Inventor
    kind: hypothesis
    text: Proposed H-C05-A - full spectra are exactly explained by affine models over Z_n.
    refs: [CLM-C05-06]
  - key: C05-08
    agent: Mathematical Skeptic
    kind: rejection
    text: H-C05-A rejected - x = (yx)(x(yy)) is satisfied by NAND on two elements but by no affine operation over Z_2 (both facts Lean-certified); four identities in total.
    refs: [CLM-C05-06, EXP-C05-05]
  - key: C05-09
    agent: Research Director
    kind: decision
    text: "Two long runs were stopped and rescoped under heavy shared CPU load (other cycles running in parallel): the census to n <= 6 (n = 7 UNSAT instances dominated) and the frontier push to n <= 10 with budget 1e6 (n = 11, 12 would likely have hit the timeout and lost all results, since the runner writes results only at the end). Lesson: long experiments should checkpoint partial results."
    refs: [EXP-C05-01, EXP-C05-03]
  - key: C05-10
    agent: Formal Verifier
    kind: result
    text: Frontier push agreed with every size stated in the ETP notes (0 disagreements) and settled new sizes - memberships 467 (9), 677 (5, 7, 9), 1286 (9), 1313 (9), 1516 (9), all Lean-certified; gaps 501 (6, 7), 677 (6), 883 (6), 1076 (8), 1083 (5, 6), all with drat-trim-verified DRUP proofs (48/48 refutations verified).
    refs: [CLM-C05-07, CLM-C05-08, EXP-C05-03, EXP-C05-04, EXP-C05-06]
  - key: C05-11
    agent: Mathematical Skeptic
    kind: review
    text: Caveats recorded - EXP-C05-02's 'identical model set' grouping compared non-canonical representatives (count not used); the field decided_beyond_notes over-counts because the notes' 'starting with' phrasing implicitly settles smaller sizes; most census non-memberships are solver-trusted; novelty of the frontier facts is relative to the notes and to a partially read ETP paper.
    refs: [EXP-C05-02, EXP-C05-03]
  - key: C05-12
    agent: Mathematical Explorer
    kind: pattern
    text: Laws 677 and 1313 share the spectrum fragment 1, 5, 7, 9 (not 2, 3, 4, 6) with idempotent quasigroup models; conjectured spectrum {1} plus odd n >= 5 (CLM-C05-09), pending orders 8 and 10.
    refs: [CLM-C05-09]
  - key: C05-13
    agent: Historian and Novelty Analyst
    kind: revision
    text: "Re-reading Le Floch's notes while writing the textbook chapter found statements missed in the first pass: the list of 31 laws without models of order 2 (incl. 501, 677, 1083, 1719), the list of 14 laws with order-2 but no order-3 models (incl. 883), and the Gaussian-integer models of law 467, which include order 9 = 3^2 + 0^2. CLM-C05-07 no longer counts 467 (order 9) as new, CLM-C05-08 separates new gaps from gaps stated in the notes, and the README frontier table was corrected (1719 has no new facts). Entry C05-10 overstated these points."
    refs: [CLM-C05-07, CLM-C05-08]

  - key: C05-14
    agent: Mathematical Skeptic
    kind: rejection
    text: "Independent review (reviews/skeptic_C05_C08_C12.md) - CLM-C05-09 refuted by linear models of order 16 over GF(16) for both laws (Lean-checked); all other C05 claims upheld (own CNF encodings with CaDiCaL and Kissat reproduce the census and all 15 claimed gaps)."
    refs: [CLM-C05-09, reviews/skeptic_C05_C08_C12.md]
  - key: C05-15
    agent: Mathematical Explorer
    kind: result
    text: "EXP-C05-07 - systematic search for linear models over GF(q), q <= 128. 0 conflicts with SAT, DRUP gaps or notes; even orders for 14 of 15 laws; 670 at n = 9 settled (new relative to the notes). Lesson - the Z_n affine search of EXP-C05-05 was blind to non-cyclic additive groups."
    refs: [EXP-C05-07, CLM-C05-10]

