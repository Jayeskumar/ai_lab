  - id: CLM-C05-21
    type: conjecture
    system: SYS-B
    title: "H-C05-J': none of the 12 open ETP laws x = y*T without a model of order 2 has a model of order n = 2 (mod 4)"
    statement: "The laws 467, 501, 670, 677, 704, 907, 1076, 1083, 1110, 1279, 1286 and 1313 have no finite model of any order n = 2 (mod 4)."
    verification: CONJECTURE
    evidence: [EXP-C05-12, EXP-C05-09, EXP-C05-08, EXP-C05-10]
    novelty: NOT ASSESSED
    limitations: "Proven for law 501, whose spectrum is exactly the n = 0, 1 (mod 4) (CLM-C05-22). Evidence for the other 11: none has a model of order 2, 6 or 10 (certified, CLM-C05-17); for the quasigroup laws 1076, 1110, 1279, 1286 and 1313 every order up to 13 is decided (CLM-C05-16), so 14 is their first open order = 2 (mod 4). A counterexample cannot come from group endomorphisms: in a group of order = 2 (mod 4) the elements of odd order form a subgroup of index 2 preserved by every endomorphism, so such a model would have a quotient of order 2, a model of order 2 (reviews/skeptic_batch1.2.md, section 4). Spectra are closed under products, and a product has order 2 (mod 4) only if a factor has; the linear models of EXP-C05-07 have prime-power orders, odd or divisible by 4. The general form for all laws x = y*T is false (CLM-C05-18, law 474), so a proof must use more than the shape of the law. Twelve laws and two orders each are thin evidence; the statement is recorded to be tested, not as a finding."
    related: [CLM-C05-18, CLM-C05-17]

  - id: CLM-C05-22
    type: theorem
    system: SYS-B
    title: "The spectrum of ETP law 501, x = y(y(x(xy))), is exactly {n : n = 0, 1 (mod 4)}"
    statement: "A magma of order n >= 1 satisfying x = y(y(x(xy))) exists if and only if n = 0 or 1 (mod 4). Necessity: x # y = x(xy) is a semi-symmetric quasigroup (law 14) whose left translations are squares L_x^2, hence even, while every finite semi-symmetric quasigroup of order n has prod_y sign(L_y) = (-1)^(n(n-1)/2), because (x, y) -> (y, x # y) has order 3. Sufficiency: on A = Z_n (n = 1 mod 4) or Z_2 x Z_2 x Z_{n/4} (4 | n), x # y = -x - y has involutive translations with an even number of 2-cycles; their square roots sigma_x give the model x * y = sigma_x(y)."
    verification: PROVEN
    proof: "proofs/paper/C05.md#theorem-14-clm-c05-22--the-spectrum-of-law-501-is-exactly-the-orders-n--0-1-mod-4"
    lean: [proofs/lean/Infinity/C05_Law501.lean, proofs/lean/Infinity/C05_Magmas.lean]
    proof_check: "Lean 4 for the necessity - law501_card_mod_four (proofs/lean/Infinity/C05_Law501.lean, standard axioms only): every finite model has order = 0, 1 (mod 4), via sign_prodComm and Equiv.Perm.sign_prodCongrLeft; sufficiency by the written construction (proofs/paper/C05.md, Theorem 14), computer-checked for every n <= 100 (EXP-C05-15), with models of orders 4, 5 (C05_Law501.lean) and 12 (E501_order12_law, C05_Magmas.lean) Lean-checked by decide; upheld by the independent Skeptic (reviews/skeptic_batch1.2.md: every step of the written proof checked, the construction rebuilt independently for all 50 orders up to 100, the Lean file compiled)"
    evidence: [EXP-C05-15, EXP-C05-09, EXP-C05-12, EXP-C05-06]
    novelty: POTENTIALLY NOVEL
    novelty_basis: "Not found in any source read (reviews/historian_501.md): the ETP commentary file Equation501.md at HEAD (Sep 12, 2026) says 'The finite spectrum ... of this law is unknown'; B. Le Floch's notes (July 2025) give 'unknown spectrum containing 1,4,5,8,9' and note that x # y = x(xy) obeys law 14; the only exclusions in the sources are order 2 and idempotent models of order = 2 (mod 3) (B. Gunby-Mann, July 14, 2025); no source mentions orders 10-12. The sign identity used for the necessity is a one-line corollary of the classical parity relation pi_r + pi_c + pi_s = C(n,2) (mod 2) for Latin squares (J. C. M. Janssen, JCTA 69 (1995) 173-181; P. Zappa, Boll. UMI 10-A (1996) 63-69; see N. Francetic, S. Herke, I. M. Wanless, JCTA 155 (2018) 67-99, arXiv:1703.04764), since the row, column and symbol parities of a semi-symmetric quasigroup coincide; the semi-symmetric case was not found stated. ETP members may hold unpublished results."
    change_reason: "Historian novelty check 2026-10-20 (reviews/historian_501.md) for the novelty label; Skeptic review (reviews/skeptic_batch1.2.md, P7) for the statement: the cyclic construction needs n = 1 (mod 4), not just n odd"
    related: [CLM-C05-21, CLM-C05-17, CLM-C05-15, CLM-C05-08, CLM-C05-04]

