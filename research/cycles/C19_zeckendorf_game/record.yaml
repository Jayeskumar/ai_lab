cycle: C19
title: "The longest Zeckendorf game"
branch: C-D
status: complete
systems: [SYS-C, SYS-D]

experiments:
  - id: EXP-C19-01
    analysis: "Exhaustive dynamic programming (no strategy assumed) gives the longest game L(n) for every n <= 150 (up to 910,775 configurations at n = 150). It reproduces the lab's values (n <= 40), the Skeptic's (n <= 60) and hence the published ones (n <= 49); the split-first strategy of Cusenza et al. attains the optimum for every n <= 150; their bound B(n) is attained exactly for n = 1, 2, 4, 7, 12, 20, 33, 54, 88, 143 = F_k - 1; the reachable positions are exactly the partitions of n into Fibonacci parts (OEIS A003107)."
    verification: PROVEN
    related: [CLM-C19-07, CLM-C19-08]
  - id: EXP-C19-02
    analysis: "The length identity |G| = B(n) - sum_{i>=2} (i-1) MC_i holds for every greedy game n < 1500 and for 1500 uniformly random games; the split phase ends at the lazy Fibonacci representation for every n < 5000, and 300 random firing orders never change its end point or its length; the insertion hypothesis H-C19-4 fails for 288 of the first 300 n (first at n = 3)."
    verification: PROVEN
    counterexamples: ["H-C19-4: L(4) = 3 but L(3) + lambda(3) = 2 + 0"]
    related: [CLM-C19-01, CLM-C19-02, CLM-C19-13]
  - id: EXP-C19-03
    analysis: "D(F) = floor(j^2/4) for the Fibonacci input on every level j <= 33; the two-summand law holds for all 276 pairs with j <= 24; the consecutive-pair model fails for 23,680 of the n < 30000 (first n = 12), the top-summand effect is not a function of the two highest levels (87 ambiguous keys, e.g. (4,2)), and the lazy-run linear model is inconsistent already for n < 160 (rank 46 < 47); the recursion with the explicit rho reproduces D(n) for every n < 30000 (in-sample: it was inferred from this range); D(n) <= floor(j^2/4) and L(n+1) > L(n) (n >= 1) hold throughout."
    counterexamples: ["H-C19-1: n = 12 (levels 4, 2, 0): D = 0, consecutive-pair model 1", "H-C19-3: lazy-run model inconsistent on n < 160"]
    related: [CLM-C19-03, CLM-C19-05, CLM-C19-06, CLM-C19-09, CLM-C19-10, CLM-C19-11, CLM-C19-12]
  - id: EXP-C19-04
    analysis: "Out of sample, the recursion agrees with the greedy simulation on all 6,272 tested n (every n in [30000, 36000), 200 random n < 10^6, 12 random n < 2*10^7, 60 numbers F_j + m). It evaluates L(10^7) in 9.3e-5 s against 8.3 s for the simulation. L(n), D(n), L(F_j) and the two rho sequences are not in the OEIS. (phi^2 n - L(n)) / (log_phi n)^2 stays between 0.34 and 0.38 for n = 10^3 ... 10^18."
    related: [CLM-C19-05, CLM-C19-14]
  - id: EXP-C19-05
    analysis: "After the Skeptic's review - the lazy-representation method L(n) = Psi(lazy(n)) + (second phase) agrees with full simulation of the strategy game for every n < 20,000; the conjectured recursion CLM-C19-05 agrees with it on all 103,799 tested n (all n < 10^5, 3000 random n < 10^15, 800 numbers F_j + m with j = 30..69); the second phase has at most B(n) - Psi(lazy(n)) <= 1 + (t+1)(t+6)/2 moves on every tested n (largest ratio to the bound 0.476); 26, 53, 81 and 109 second-phase moves at n = 10^6, 10^9, 10^15, 10^18."
    related: [CLM-C19-05, CLM-C19-09, CLM-C19-14, CLM-C19-15]

claims:
  - id: CLM-C19-01
    type: theorem
    system: SYS-D
    title: "Every Zeckendorf game has length B(n) - sum_{i>=2} (i-1) MC_i"
    statement: |
      For every game G on n (from n copies of F_1 to the Zeckendorf representation), |G| = B(n) - sum_{i>=2} (i-1) MC_i(G),
      where B(n) = sum_i (F_{i+2} - i - 2) delta_i is the bound of Cusenza et al. and MC_i counts the combines
      F_{i-1} + F_i -> F_{i+1}. Hence a game is longest iff it minimises the weighted number of such combines, and
      L(n) = B(n) - D(n) with D(n) = min_G sum (i-1) MC_i(G).
    verification: PROVEN
    proof_check: "written proof (proofs/paper/C19.md Theorem 1; potential Psi(c) = sum c_i a_i); the per-move changes of Psi and their sum over an arbitrary move list are Lean-verified (dPsi_C1, dPsi_S2, dPsi_split, dPsi_combine, length_identity; standard axioms only); checked on all greedy games n < 1500 and 1500 random games (EXP-C19-02)"
    proof: proofs/paper/C19.md#theorem-1-clm-c19-01--an-exact-length-identity
    lean: [proofs/lean/Infinity/C19_Zeckendorf.lean]
    evidence: [EXP-C19-02]
    novelty: REDISCOVERY
    novelty_basis: "Stated as the exact game length in A. Cusenza, A. Dunkelberg, K. Huffman, D. Ke, M. McClatchey, S. J. Miller, C. Mizgerd, V. Tiwari, J. Ye, X. Zheng, Bounds on Zeckendorf games, Fibonacci Quart. 60 (2022), no. 1, 57-71, eq. (3.16) (derived by linear algebra and then weakened to obtain their Thm 1.3; arXiv:2009.09510); also used as an inequality step in J. Cheigh et al., Towards the Gaussianity of random Zeckendorf games, CANT VI, Springer 2025. The one-line potential proof for every game is ours."
    change_reason: "Skeptic review 2026-10-18 (reviews/skeptic_C13_C19.md, C8) - the identity is stated explicitly in Cusenza et al., eq. (3.16); proof upheld"
  - id: CLM-C19-02
    type: theorem
    system: SYS-D
    title: The split phase of the longest game ends at the lazy Fibonacci representation
    statement: |
      From n copies of F_1, every maximal sequence of split moves (F_1 + F_1 -> F_2, F_2 + F_2 -> F_1 + F_3,
      F_i + F_i -> F_{i-2} + F_{i+1}) has the same length and ends at the lazy representation of n - the unique
      representation as a sum of distinct F_i (F_1 = 1, F_2 = 2, ...) without two consecutive missing indices below
      the largest one.
    verification: PROVEN
    proof_check: "written proof (proofs/paper/C19.md Theorem 2 - abelian property, an explicit carry lemma by induction, increment of the lazy representation); verified for every n < 5000 and for 300 random firing orders (EXP-C19-02); skeptic-reviewed 2026-10-18 (reviews/skeptic_C13_C19.md) - from every position of value <= 200 all maximal split sequences have one end point and one length"
    proof: proofs/paper/C19.md#theorem-2-clm-c19-02--the-split-phase-ends-at-the-lazy-representation
    evidence: [EXP-C19-02]
    novelty: POTENTIALLY NOVEL
    novelty_basis: "Searches (2026-10-18) for the Zeckendorf game together with lazy representations / chip-firing found no such statement; the papers on the game (Baird-Smith et al. arXiv:1809.04881; Li et al. arXiv:2006.16457; Cusenza et al. arXiv:2009.09510; Cheigh et al. 2025; Black Hole Zeckendorf games arXiv:2409.10981) do not mention lazy representations. Small; uses the classical uniqueness of lazy representations (J. L. Brown, 1965). All arXiv Zeckendorf-game papers to 2026-10-07 were checked (including the reversed, ordered and black-hole variants); none mentions lazy representations (Historian audit 2026-10-19, reviews/historian_C11_C20.md)."
    change_reason: "Historian audit 2026-10-19 - label upheld, search extended"
  - id: CLM-C19-03
    type: theorem
    system: SYS-D
    title: "Closed form of the longest game on a Fibonacci number: L(F_k) = F_{k+2} - k - 2 - floor((k-1)^2/4)"
    statement: |
      With F_1 = 1, F_2 = 2, F_{i+1} = F_i + F_{i-1}, the longest Zeckendorf game on n = F_k has length
      F_{k+2} - k - 2 - floor((k-1)^2/4) (0, 1, 2, 5, 10, 20, 37, 67, 117, 201, ...), i.e. its deficit to the bound
      B(F_k) is the quarter-square floor((k-1)^2/4).
    verification: PROVEN
    proof_check: "written proof (proofs/paper/C19.md Theorem 4) from CLM-C19-01, CLM-C19-02 and the published optimality of the split-first strategy (Cusenza et al. 2022, Thm 1.2); the weight sums are Lean-verified (weight_even, weight_odd, quarter_square_even, quarter_square_odd); checked for every level j <= 33 (EXP-C19-03) and by exhaustive search for n <= 150 (EXP-C19-01); skeptic-reviewed 2026-10-18 (reviews/skeptic_C13_C19.md) - the Skeptic read [C, Thm 1.2] in the arXiv and published versions (it says exactly what the proof uses) and confirmed the formula by strategy-free exhaustive search up to F_12 = 233 (L = 566, 13.8 million positions)"
    proof: proofs/paper/C19.md#theorem-4-clm-c19-03--the-longest-game-on-a-fibonacci-number
    lean: [proofs/lean/Infinity/C19_Zeckendorf.lean]
    evidence: [EXP-C19-01, EXP-C19-03]
    novelty: POTENTIALLY NOVEL
    novelty_basis: "Cusenza et al. (2022) give the exact length only for n = F_k - 1 (their Thm 1.4) and a bound otherwise; Cheigh et al. (2025) state that a closed form for non-Fibonacci inputs is open and describe the Fibonacci case as treated by Cusenza et al., whose paper we read in full and which treats F_k - 1, not F_k. The sequence L(F_k) is not in the OEIS (EXP-C19-04). Medium-low confidence that no formula exists in the literature. Confirmed 2026-10-19: Cusenza et al. (arXiv:2009.09510) contain no formula for n = F_k; no later Zeckendorf-game paper treats it (arXiv to 2026-10-07); L(F_k) is still not in the OEIS (Historian audit 2026-10-19, reviews/historian_C11_C20.md)."
    change_reason: "Historian audit 2026-10-19 - label upheld, search extended"
  - id: CLM-C19-04
    type: theorem
    system: SYS-D
    title: "A short proof that only n = F_k - 1 can be played with split moves alone (Cusenza et al., Thm 1.4)"
    statement: The Zeckendorf game on n can be played with split and combine-1 moves only iff n = F_k - 1 for some k >= 2.
    verification: PROVEN
    proof_check: written proof (proofs/paper/C19.md Corollary 3, from CLM-C19-02 - a split-only game ends at the lazy representation, which equals the Zeckendorf representation exactly for alternating digit strings); consistent with EXP-C19-01 (bound attained exactly at F_k - 1 for n <= 150)
    proof: proofs/paper/C19.md#corollary-3-clm-c19-04--a-short-proof-of-c-thm-14
    evidence: [EXP-C19-01, EXP-C19-02]
    novelty: REDISCOVERY
    novelty_basis: "The statement is Theorem 1.4 of Cusenza et al., Fib. Quart. 60 (2022), arXiv:2009.09510; the proof via lazy representations is new to us and much shorter."
  - id: CLM-C19-05
    type: conjecture
    system: SYS-D
    title: A two-sequence recursion for the longest Zeckendorf game on every n
    statement: |
      Let h(k) = floor(k^2/4) and define rho_p (p = 0, 1) by rho_p(0) = 0 and, for m = F_{i+1} + t with Zeckendorf top
      level i (0 <= t < F_i): rho_p(m) = r_p(i) + [i = p mod 2] * max(0, rho_p(t) - h(i-2)), where r_p(0) = 1,
      r_p(i) = h(i) + 2 for i >= 1, i = p mod 2, and r_p(i) = h(i+1) + 1 otherwise. Then D(0) = 0 and
      D(F_{j+1} + m) = h(j) + D(m) - rho_{j mod 2}(m) for 0 <= m < F_j, and L(n) = B(n) - D(n).
    verification: COMPUTATIONALLY SUPPORTED
    evidence: [EXP-C19-03, EXP-C19-04, EXP-C19-05]
    novelty: POTENTIALLY NOVEL
    novelty_basis: "Cheigh et al. (CANT VI, Springer 2025) state that a convenient closed form for the longest game on non-Fibonacci inputs is open; no such formula found in the papers above or the OEIS (L(n) has no OEIS entry, EXP-C19-04)."
    limitations: "Inferred from all n < 30000 (in-sample) and confirmed out of sample on 6,272 further n up to 2*10^7 (EXP-C19-04) and on 103,799 n - all n < 10^5, 3000 random n < 10^15 and 800 numbers F_j + m - against the provably correct lazy-representation method (EXP-C19-05, Theorem 7); the Skeptic also checked it against strategy-free exhaustive search for n <= 200 and n = 233. No proof. The data beyond exhaustive search rely on the published optimality of the strategy (Cusenza et al., Thm 1.2)."
    change_reason: "Skeptic review 2026-10-18 (C9) - now tested against the provably correct method of Theorem 7 on many more n"
  - id: CLM-C19-06
    type: conjecture
    system: SYS-D
    title: The deficit of a two-summand number depends only on the lower level and the parity of the gap
    statement: |
      For levels j >= i + 2, D(F_{j+1} + F_{i+1}) = floor(j^2/4) + floor(i^2/4) - R(j,i) with R(j,0) = 1,
      R(j,i) = floor((i+1)^2/4) + 1 if j - i is odd and R(j,i) = floor(i^2/4) + 2 if j - i is even (i >= 1).
    verification: COMPUTATIONALLY SUPPORTED
    evidence: [EXP-C19-03]
    novelty: POTENTIALLY NOVEL
    novelty_basis: Special case of CLM-C19-05; not found in the literature searched.
    limitations: "Checked for all 276 pairs with j <= 24 (the Skeptic - all 1,770 pairs with j <= 60); no proof."
    change_reason: "Skeptic review 2026-10-18 - range extended"
  - id: CLM-C19-07
    type: theorem
    system: SYS-D
    title: Exact longest games for n <= 150 and independent confirmation of the split-first strategy
    statement: The longest game lengths L(n) for n <= 150 are those listed in results/EXP-C19-01.json (0, 0, 1, 2, 3, 5, 6, 8, 10, 11, ...); for every n <= 150 the split-first strategy of Cusenza et al. attains them.
    verification: PROVEN
    proof_check: computer-assisted - exhaustive longest-path dynamic programming over all reachable configurations (no strategy assumed), cross-checked against two independent greedy implementations and the earlier values n <= 60
    proof: experiments/C19/E01_exact_longest.py
    evidence: [EXP-C19-01]
    novelty: REDISCOVERY
    novelty_basis: "Values for n <= 49 are published (Baird-Smith et al., arXiv:1809.04881, Fig. 4); optimality of the strategy for all n is Cusenza et al. 2022, Thm 1.2. Our computation is an independent check."
  - id: CLM-C19-08
    type: theorem
    system: SYS-D
    title: Every multiset of Fibonacci numbers with sum n is a reachable game position
    statement: The positions reachable from n copies of F_1 are exactly the multisets of Fibonacci numbers F_1, F_2, ... with sum n; their number is the number of partitions of n into Fibonacci parts (OEIS A003107).
    verification: PROVEN
    proof_check: "written proof (proofs/paper/C19.md Proposition 6 - undoing combines reaches n copies of F_1; read backwards this is a forward game); state counts equal the partition counts for every n <= 150 (EXP-C19-01)"
    proof: proofs/paper/C19.md#proposition-6-clm-c19-08--every-fibonacci-partition-of-n-is-a-reachable-position
    evidence: [EXP-C19-01]
    novelty: NOT ASSESSED
    novelty_basis: Elementary; the reverse-move argument is used for shortest games by Cheigh et al. (2025).
  - id: CLM-C19-09
    type: observation
    system: SYS-D
    title: "D(n) <= floor(j^2/4) for top level j, and L is strictly increasing"
    statement: For 1 <= n < 30000, the deficit satisfies D(n) <= floor(j^2/4) where j is the top Zeckendorf level of n (equality at the Fibonacci numbers), and L(n+1) > L(n).
    verification: COMPUTATIONALLY SUPPORTED
    evidence: [EXP-C19-03]
    novelty: NOT ASSESSED
    limitations: "Finite range (the Skeptic - every n < 10^5; among n < 400 equality D = floor(j^2/4) > 0 occurs only at Fibonacci numbers); both statements would follow from CLM-C19-05 only with further work. A weaker bound, D(n) <= 1 + (t+1)(t+6)/2 with t the top level of lazy(n), is proved (CLM-C19-15)."
    change_reason: "Skeptic review 2026-10-18 - weaker bound proved (CLM-C19-15); range extended"
  - id: CLM-C19-10
    type: hypothesis
    system: SYS-D
    title: "H-C19-1: the deficit is additive up to consecutive-pair corrections (refuted)"
    statement: D(n) = sum_t floor(j_t^2/4) - sum_t R(j_t, j_{t+1}) over consecutive Zeckendorf levels j_1 > j_2 > ... of n.
    verification: REFUTED
    counterexample: "n = 12 = F_5 + F_3 + F_1 (levels 4, 2, 0): D(12) = 0 but the model gives 1; 23,680 of the n < 30000 violate it (EXP-C19-03)."
    evidence: [EXP-C19-03]
    novelty: NOT ASSESSED
  - id: CLM-C19-11
    type: hypothesis
    system: SYS-D
    title: "H-C19-2: the effect of the top summand depends only on the two highest levels (refuted)"
    statement: D(n) - D(n - F_top) is a function of the two highest Zeckendorf levels of n.
    verification: REFUTED
    counterexample: "Levels (4, 2) occur with D(n) - D(n - F_5) in {0, 1} (n = 12 and n = 11); 87 such ambiguous pairs below 30000 (EXP-C19-03). The dependence is through the parity chain of lower levels, captured by rho in CLM-C19-05."
    evidence: [EXP-C19-03]
    novelty: NOT ASSESSED
  - id: CLM-C19-12
    type: hypothesis
    system: SYS-D
    title: "H-C19-3: the deficit is additive over the runs of the lazy representation (refuted)"
    statement: There is a function phi(start, length) with D(n) = sum of phi over the maximal runs of ones of the lazy representation of n.
    verification: REFUTED
    counterexample: "For n < 160 the linear system D(n) = sum phi(run) has coefficient rank 46 and augmented rank 47 (exact rational elimination), so it has no solution (EXP-C19-03)."
    evidence: [EXP-C19-03]
    novelty: NOT ASSESSED
  - id: CLM-C19-13
    type: hypothesis
    system: SYS-D
    title: "H-C19-4: the longest game is built by inserting one chip at a time (refuted)"
    statement: L(n + 1) = L(n) + lambda(n), where lambda(n) is the longest game from the Zeckendorf representation of n plus one extra F_1.
    verification: REFUTED
    counterexample: "n = 3: L(4) = 3, L(3) = 2, lambda(3) = 0 (Zeckendorf(3) + F_1 is already Zeckendorf); fails for 288 of the first 300 n (EXP-C19-02). Longest games avoid early normalisation, so they do not pass through Zeckendorf(n)."
    evidence: [EXP-C19-02]
    novelty: NOT ASSESSED
  - id: CLM-C19-14
    type: algorithmic
    system: SYS-D
    title: "Computing the longest game with O(log^2 n) moves instead of Theta(n)"
    statement: "The longest game can be computed with O(log^2 n) moves: L(n) = Psi(lazy(n)) + (length of the strategy game of Cusenza et al. started at the lazy representation), whose second phase has at most B(n) - Psi(lazy(n)) <= 1 + (t+1)(t+6)/2 moves (t the top level of lazy(n)); correct whenever [C, Thm 1.2] is (like Theorem 4). The published method plays about phi^2 n moves. The conjectured recursion (CLM-C19-05) gives the same values at the same speed."
    verification: "PROVEN"
    evidence: [EXP-C19-05, EXP-C19-04]
    improvement: IMPROVEMENT
    improvement_detail: "Against simulating the strategy game (about phi^2 n moves) - the second phase has 26, 53, 81 and 109 moves at n = 10^6, 10^9, 10^15, 10^18, about 1e-4 s in CPython; full simulation takes about 0.8 s at 10^6 and 8 s at 10^7 (EXP-C19-04/05; loaded machine, order of magnitude only). Asymptotically O(log^2 n) moves vs Theta(n). The first version of this claim rested on the conjectured recursion; the method of Theorem 7 is provably correct (given [C, Thm 1.2]) and as fast."
    novelty: POTENTIALLY NOVEL
    novelty_basis: No sublinear method for the longest game was found in the literature listed under CLM-C19-05.
    limitations: "Correct as far as [C, Thm 1.2] is; that theorem was independently confirmed only for n <= 233 (exhaustive search)."
    proof: "proofs/paper/C19.md#theorem-7-clm-c19-14--an-olog-n-move-method-for-ln"
    proof_check: "written proof (proofs/paper/C19.md Theorem 7, from Theorems 1-2; the method was pointed out by the Skeptic in its review and written out and checked by the Director); conditional on the published optimality of the strategy (Cusenza et al. 2022, Thm 1.2), like Theorem 4; agrees with full simulation of the strategy game for every n < 20000 and with the recursion on 103,799 n (EXP-C19-05); the arithmetic of the move bound B(n) - Psi(lazy(n)) <= 1 + (t+1)(t+6)/2 is Lean-checked (proofs/lean/Infinity/C19_DeficitBound.lean, deficit_bound)"
    lean: [proofs/lean/Infinity/C19_DeficitBound.lean]
    change_reason: "Batch 1.1 (G2) - the move bound's arithmetic is Lean-checked (C19_DeficitBound.lean)"

  - id: CLM-C19-15
    type: theorem
    system: SYS-C
    title: "The deficit of the longest Zeckendorf game is O(log^2 n) - D(n) <= 1 + (t+1)(t+6)/2, so L(n) = phi^2 n - O(log^2 n)"
    statement: "For every n, D(n) = B(n) - L(n) <= 1 + (t+1)(t+6)/2, where t is the top level of the lazy Fibonacci representation of n; consequently L(n) = phi^2 n - O(log^2 n). No optimality theorem is needed."
    verification: PROVEN
    proof: "proofs/paper/C19.md#theorem-8-clm-c19-15--the-deficit-is-olog-n-unconditionally"
    proof_check: "written proof with a Lean-checked arithmetic core - proofs/paper/C19.md Theorem 8: the split phase reaches lazy(n) after Psi(lazy(n)) moves, so L(n) >= Psi(lazy(n)) and D(n) <= B(n) - Psi(lazy(n)) (written; the argument is the Skeptic's, reviews/skeptic_C13_C19.md C9, written out and checked by the Director); the estimate B(n) - Psi(lazy(n)) <= 1 + (t+1)(t+6)/2 - the weight identity a_(k+1) = phi^2 F_(k+1) + psi^(k+2) - k - 3 and the bound for any two 0/1 strings of equal value with the second one vanishing above t - is Lean-checked (proofs/lean/Infinity/C19_DeficitBound.lean: weight_identity, deficit_bound, deficit_bound_int; standard axioms only); the bound holds on all 103,799 n of EXP-C19-05 (largest ratio 0.476)"
    evidence: [EXP-C19-05]
    novelty: NOT ASSESSED
    novelty_basis: "The asymptotics L(n) ~ phi^2 n are known (Cusenza et al.); an explicit O(log^2 n) error bound was not looked for in the literature."
    lean: [proofs/lean/Infinity/C19_DeficitBound.lean]
    change_reason: "Batch 1.1 (G2) - arithmetic core of the bound formalised in Lean (C19_DeficitBound.lean)"

