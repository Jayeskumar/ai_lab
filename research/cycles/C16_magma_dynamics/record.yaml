    text: "Laver tables - by Laver's monotonicity x*y > x below the top element, Fibonacci sequences climb to the top and then alternate; the pair map has exactly one fixed point and N - 1 two-cycles. Affine magmas reduce to companion matrices; the anchored associative magma of C06 is the Fibonacci sequence mod N in disguise; nim-multiplication gives Pisano periods of 2^(2^k) - 1."
    refs: [CLM-C16-12, CLM-C16-14, CLM-C16-15]
